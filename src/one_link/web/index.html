<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One_link</title>
<style>
  /* ── Reset + tokens ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-0:        #0b0d12;
    --bg-1:        #11141b;
    --bg-2:        #181c25;
    --bg-3:        #232836;
    --bg-elev:    #1c212d;
    --line:       #232836;
    --text:       #e8ecf2;
    --text-dim:   #8a93a6;
    --text-dimmer:#5e6577;
    --accent:     #7c5cff;
    --accent-2:   #4ec1ff;
    --good:       #46d39a;
    --warn:       #f5c451;
    --bad:        #ff6b6b;
    --bubble-in:  #1f2533;
    --bubble-out: linear-gradient(135deg, #6a4dff 0%, #4ec1ff 100%);
    --shadow:     0 6px 24px rgba(0,0,0,.35);
    --radius:     14px;
    --radius-sm:  9px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text",
            "Inter", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg-0);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: 0; }
  input, textarea { font: inherit; color: inherit; }

  /* ── App layout ─────────────────────────────────────────────────────── */
  .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .2px; }
  .brand .logo {
    width: 24px; height: 24px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 10px rgba(124,92,255,.45);
  }
  .me {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-dim); font-size: 13px;
  }
  .me .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
  .me code { font-family: var(--mono); color: var(--text); }

  .main { display: grid; grid-template-columns: 280px 1fr 0fr; min-height: 0; }
  .main.with-files { grid-template-columns: 280px 1fr 320px; }

  /* ── Sidebar (peers + rooms) ───────────────────────────────────────── */
  .side { background: var(--bg-1); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side .section-h {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 8px;
    color: var(--text-dimmer);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px;
  }
  .side .section-h .count { background: var(--bg-3); padding: 1px 8px; border-radius: 10px; color: var(--text-dim); font-size: 11px; }
  .peerlist { padding: 0 8px 12px; flex: 1; overflow-y: auto; }
  .peer {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--text); transition: background .12s ease;
  }
  .peer:hover { background: var(--bg-2); }
  .peer.active { background: linear-gradient(180deg, rgba(124,92,255,.18), rgba(124,92,255,.08)); }
  .peer .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 600; font-size: 13px; color: white;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
    position: relative;
    flex-shrink: 0;
  }
  .peer .avatar::after {
    content: ""; position: absolute; right: -1px; bottom: -1px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--text-dimmer); border: 2px solid var(--bg-1);
  }
  .peer.online .avatar::after { background: var(--good); }
  .peer .name { font-weight: 500; line-height: 1.1; }
  .peer .sub  { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .peer .text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .peer .text .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty {
    color: var(--text-dim); font-size: 13px;
    padding: 16px 16px; text-align: center;
  }
  .empty .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--bg-3); border-top-color: var(--accent);
    margin: 6px auto 8px; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .side-foot {
    border-top: 1px solid var(--line); padding: 10px 12px;
    display: flex; gap: 8px;
  }
  .side-foot .btn {
    flex: 1; padding: 8px 10px; border-radius: var(--radius-sm);
    background: var(--bg-2); color: var(--text-dim); font-size: 13px;
    transition: background .12s, color .12s;
  }
  .side-foot .btn:hover { background: var(--bg-3); color: var(--text); }
  .side-foot .btn.active { background: var(--bg-3); color: var(--text); }

  /* ── Conversation pane ────────────────────────────────────────────── */
  .convo { display: flex; flex-direction: column; min-height: 0; background: var(--bg-0); }
  .convo-h {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--line);
  }
  .convo-h .who { display: flex; align-items: center; gap: 12px; }
  .convo-h .avatar { width: 36px; height: 36px; }
  .convo-h .avatar { font-size: 14px; }
  .convo-h .who .text .name { font-weight: 600; line-height: 1.1; }
  .convo-h .who .text .sub  { font-size: 12px; color: var(--text-dim); }
  .convo-h .actions button {
    padding: 7px 12px; border-radius: var(--radius-sm);
    background: var(--bg-2); color: var(--text-dim); font-size: 12px;
  }
  .convo-h .actions button:hover { background: var(--bg-3); color: var(--text); }
  .convo-h .actions button.active { background: var(--accent); color: white; }

  .messages {
    flex: 1; overflow-y: auto; padding: 18px 22px 14px;
    display: flex; flex-direction: column; gap: 8px;
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(124,92,255,.07), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(78,193,255,.05), transparent 60%),
      var(--bg-0);
  }
  .day-sep {
    align-self: center;
    color: var(--text-dimmer); font-size: 11px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--bg-1); margin: 8px 0;
  }
  .msg {
    max-width: 70%;
    padding: 9px 13px;
    border-radius: 14px;
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
    animation: pop .15s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.in  { align-self: flex-start; background: var(--bubble-in); border-top-left-radius: 4px; }
  .msg.out { align-self: flex-end;   background: var(--bubble-out); border-top-right-radius: 4px; color: white; }
  .msg .when { display: block; font-size: 10px; color: var(--text-dimmer); margin-top: 3px; }
  .msg.out .when { color: rgba(255,255,255,.75); }
  .msg.file {
    display: flex; align-items: center; gap: 12px; min-width: 240px;
  }
  .msg.file .icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(255,255,255,.12);
    display: grid; place-items: center; font-size: 18px;
    flex-shrink: 0;
  }
  .msg.file .meta { flex: 1; min-width: 0; }
  .msg.file .meta .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.file .meta .size { font-size: 11px; color: var(--text-dimmer); }
  .msg.out.file .meta .size { color: rgba(255,255,255,.75); }
  .msg.file a { color: inherit; text-decoration: none; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.10); font-size: 12px; }
  .msg.file a:hover { background: rgba(255,255,255,.18); }

  .system {
    align-self: center; font-size: 12px; color: var(--text-dim);
    background: var(--bg-1); padding: 6px 12px; border-radius: 999px;
  }

  /* ── Composer ─────────────────────────────────────────────────────── */
  .composer {
    border-top: 1px solid var(--line);
    padding: 12px 16px;
    background: var(--bg-1);
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: end;
  }
  .composer .icon-btn {
    width: 38px; height: 38px;
    border-radius: var(--radius-sm);
    background: var(--bg-2);
    color: var(--text-dim);
    display: grid; place-items: center;
    transition: background .12s, color .12s;
    font-size: 18px;
  }
  .composer .icon-btn:hover { background: var(--bg-3); color: var(--text); }
  .composer textarea {
    background: var(--bg-2);
    border: 1px solid var(--bg-3);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    resize: none; max-height: 160px;
    line-height: 1.4;
    outline: none;
    transition: border-color .12s ease;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer .send {
    background: var(--accent); color: white;
    padding: 0 16px; height: 38px; border-radius: var(--radius-sm);
    font-weight: 600;
    transition: filter .12s ease, transform .08s;
  }
  .composer .send:hover { filter: brightness(1.1); }
  .composer .send:active { transform: scale(0.97); }
  .composer .send:disabled { opacity: .4; cursor: not-allowed; filter: none; }

  /* ── Drag-drop overlay ─────────────────────────────────────────────── */
  .drop-overlay {
    position: fixed; inset: 0;
    background: rgba(11,13,18,.85);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
  }
  .drop-overlay.show { display: flex; }
  .drop-overlay .panel {
    border: 2px dashed var(--accent);
    border-radius: 22px;
    padding: 60px 80px;
    text-align: center;
    color: var(--text);
    background: rgba(124,92,255,.08);
  }
  .drop-overlay .panel h2 { font-weight: 600; margin-bottom: 6px; }
  .drop-overlay .panel p  { color: var(--text-dim); }

  /* ── Files panel (right) ──────────────────────────────────────────── */
  .files {
    background: var(--bg-1); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .files .section-h { padding: 16px 16px 10px; }
  .file-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--radius-sm); margin: 0 8px 4px;
    transition: background .12s;
  }
  .file-row:hover { background: var(--bg-2); }
  .file-row .icon { font-size: 20px; flex-shrink: 0; }
  .file-row .meta { flex: 1; min-width: 0; }
  .file-row .meta .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .file-row .meta .size { font-size: 11px; color: var(--text-dim); }
  .file-row a {
    color: var(--text-dim); padding: 6px 10px; border-radius: 6px; background: var(--bg-2); font-size: 12px;
  }
  .file-row a:hover { color: var(--text); background: var(--bg-3); }

  /* ── Toast ─────────────────────────────────────────────────────────── */
  .toast-stack { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast {
    background: var(--bg-elev); border: 1px solid var(--line);
    color: var(--text); padding: 12px 14px; border-radius: var(--radius);
    box-shadow: var(--shadow);
    font-size: 13px; min-width: 240px;
    animation: slide-in .2s ease-out;
  }
  .toast.good { border-left: 3px solid var(--good); }
  .toast.bad  { border-left: 3px solid var(--bad); }
  .toast.info { border-left: 3px solid var(--accent); }
  @keyframes slide-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  /* ── Misc ──────────────────────────────────────────────────────────── */
  .empty-pane {
    flex: 1; display: grid; place-items: center;
    color: var(--text-dim); font-size: 14px; text-align: center;
    padding: 40px;
  }
  .empty-pane .glyph {
    width: 60px; height: 60px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    margin: 0 auto 16px; opacity: .5;
    display: grid; place-items: center; font-size: 28px;
  }
  .empty-pane h3 { color: var(--text); font-weight: 600; margin-bottom: 6px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3243; }
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <header class="top">
    <div class="brand">
      <div class="logo"></div>
      <span>One_link</span>
    </div>
    <div class="me">
      <span class="dot"></span>
      <span id="me-host">…</span>
      <code id="me-id">…</code>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">

    <!-- SIDEBAR -->
    <aside class="side">
      <div class="section-h">
        <span>Peers on your LAN</span>
        <span class="count" id="peers-count">0</span>
      </div>
      <div class="peerlist" id="peerlist">
        <div class="empty">
          <div class="spinner"></div>
          searching…
        </div>
      </div>
      <div class="side-foot">
        <button class="btn active" data-pane="convo">Chat</button>
        <button class="btn" data-pane="files" id="btn-files">Files</button>
      </div>
    </aside>

    <!-- CONVERSATION -->
    <section class="convo">
      <div id="convo-empty" class="empty-pane">
        <div class="glyph">→</div>
        <h3>Pick a peer to start</h3>
        <div>Once another One_link device shows up on your LAN you can chat with them and drop files anywhere on this window to send.</div>
      </div>

      <div id="convo-active" style="display:none; flex:1; flex-direction:column; min-height:0;">
        <div class="convo-h">
          <div class="who">
            <div class="avatar" id="convo-avatar">?</div>
            <div class="text">
              <div class="name" id="convo-name">…</div>
              <div class="sub"  id="convo-sub">…</div>
            </div>
          </div>
          <div class="actions">
            <button id="btn-attach">Attach file</button>
          </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="composer">
          <button class="icon-btn" id="btn-attach2" title="Attach file">📎</button>
          <textarea id="input" placeholder="Message your peer… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
          <button class="send" id="btn-send" disabled>Send</button>
        </div>
      </div>
    </section>

    <!-- FILES PANEL (toggled) -->
    <aside class="files" id="files-panel" style="display:none;">
      <div class="section-h">
        <span>Received files</span>
        <span class="count" id="files-count">0</span>
      </div>
      <div id="filelist" style="overflow-y:auto; flex:1; padding-bottom: 12px;">
        <div class="empty">no files yet</div>
      </div>
    </aside>

  </main>

  <!-- DROP OVERLAY -->
  <div class="drop-overlay" id="drop-overlay">
    <div class="panel">
      <h2>Drop to send</h2>
      <p id="drop-target">to <span id="drop-peer">…</span></p>
    </div>
  </div>

  <!-- TOASTS -->
  <div class="toast-stack" id="toasts"></div>

  <!-- HIDDEN FILE INPUT -->
  <input type="file" id="file-input" style="display:none" multiple />
</div>

<script>
(() => {
  // ── Tiny helpers ────────────────────────────────────────────────────
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const fmtBytes = (n) => {
    if (n == null) return "?";
    const u = ["B","KB","MB","GB","TB"]; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
  };
  const fmtTime = (ms) => {
    const d = new Date(ms);
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  };
  const sameDay = (a, b) => {
    const da = new Date(a), db = new Date(b);
    return da.getFullYear() === db.getFullYear() && da.getMonth() === db.getMonth() && da.getDate() === db.getDate();
  };
  const dayLabel = (ms) => {
    const d = new Date(ms);
    const now = new Date();
    const yest = new Date(); yest.setDate(now.getDate() - 1);
    if (sameDay(ms, now.getTime())) return "Today";
    if (sameDay(ms, yest.getTime())) return "Yesterday";
    return d.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
  };
  const initials = (name) => {
    if (!name) return "?";
    const parts = name.replace(/[^a-zA-Z0-9 _-]/g, " ").split(/[ _-]+/).filter(Boolean);
    return (parts[0]?.[0] || "?").toUpperCase() + (parts[1]?.[0] || "").toUpperCase();
  };
  const fileIcon = (name) => {
    const ext = (name.split(".").pop() || "").toLowerCase();
    if (["png","jpg","jpeg","gif","webp","bmp"].includes(ext)) return "🖼";
    if (["mp4","mov","mkv","webm","avi"].includes(ext)) return "🎬";
    if (["mp3","wav","flac","ogg","m4a"].includes(ext)) return "🎵";
    if (["pdf"].includes(ext)) return "📄";
    if (["zip","tar","gz","7z","rar"].includes(ext)) return "🗜";
    if (["doc","docx","odt","rtf"].includes(ext)) return "📝";
    if (["xls","xlsx","ods","csv"].includes(ext)) return "📊";
    return "📎";
  };

  // ── State ──────────────────────────────────────────────────────────
  const state = {
    me: null,
    peers: new Map(),     // short_id -> peer
    selectedPeer: null,   // short_id
    messages: [],         // recent across all peers
    showFiles: false,
  };

  // ── API client ─────────────────────────────────────────────────────
  const api = {
    async get(p)  { const r = await fetch(p, { credentials: "include" }); if (!r.ok) throw new Error(`${p} ${r.status}`); return r.json(); },
    async post(p, body) {
      const r = await fetch(p, { method: "POST", credentials: "include", headers: {"content-type":"application/json"}, body: JSON.stringify(body) });
      const j = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(j.error || `${p} ${r.status}`);
      return j;
    },
    async upload(peer, file) {
      const fd = new FormData();
      fd.append("peer", peer);
      fd.append("file", file, file.name);
      const r = await fetch("/api/send-file", { method:"POST", credentials:"include", body: fd });
      const j = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(j.error || `upload ${r.status}`);
      return j;
    },
  };

  // ── Toasts ─────────────────────────────────────────────────────────
  const toast = (text, kind = "info", ttl = 3500) => {
    const t = el("div", `toast ${kind}`, text);
    $("#toasts").appendChild(t);
    setTimeout(() => { t.style.opacity = 0; t.style.transition = "opacity .25s"; setTimeout(() => t.remove(), 280); }, ttl);
  };

  // ── Render: peer list ──────────────────────────────────────────────
  function renderPeers() {
    const list = $("#peerlist");
    list.innerHTML = "";
    $("#peers-count").textContent = state.peers.size;
    if (state.peers.size === 0) {
      list.appendChild(el("div", "empty", "no peers yet — make sure One_link is running on your other devices on the same network"));
      return;
    }
    for (const p of state.peers.values()) {
      const row = el("div", "peer online");
      row.dataset.short = p.short_id;
      if (state.selectedPeer === p.short_id) row.classList.add("active");
      const av = el("div", "avatar", initials(p.hostname || p.short_id));
      const txt = el("div", "text");
      txt.appendChild(el("div", "name", p.hostname || "(unknown)"));
      txt.appendChild(el("div", "sub", p.short_id));
      row.appendChild(av);
      row.appendChild(txt);
      row.onclick = () => selectPeer(p.short_id);
      list.appendChild(row);
    }
  }

  // ── Render: messages ───────────────────────────────────────────────
  function renderMessages() {
    const m = $("#messages");
    m.innerHTML = "";
    if (!state.selectedPeer) return;

    const filtered = state.messages.filter(x => x.peer === state.selectedPeer);
    let lastTs = null;
    for (const msg of filtered) {
      if (!lastTs || !sameDay(lastTs, msg.ts)) {
        m.appendChild(el("div", "day-sep", dayLabel(msg.ts)));
      }
      lastTs = msg.ts;

      if (msg.t === "TEXT") {
        const b = el("div", `msg ${msg.dir}`);
        b.appendChild(document.createTextNode(msg.body || ""));
        b.appendChild(el("span", "when", fmtTime(msg.ts)));
        m.appendChild(b);
      } else if (msg.t === "FILE_OFFER") {
        const b = el("div", `msg ${msg.dir} file`);
        const icon = el("div", "icon", fileIcon(msg.name || ""));
        const meta = el("div", "meta");
        meta.appendChild(el("div", "name", msg.name || "file"));
        meta.appendChild(el("div", "size", `${fmtBytes(msg.size)} · sending…`));
        b.appendChild(icon); b.appendChild(meta);
        b.appendChild(el("span", "when", fmtTime(msg.ts)));
        m.appendChild(b);
      } else if (msg.t === "FILE_DONE") {
        const b = el("div", `msg ${msg.dir} file`);
        const icon = el("div", "icon", fileIcon(msg.name || ""));
        const meta = el("div", "meta");
        meta.appendChild(el("div", "name", msg.name || "file"));
        meta.appendChild(el("div", "size", `${fmtBytes(msg.size)} · ${msg.ok ? "received" : "FAILED"}`));
        b.appendChild(icon); b.appendChild(meta);
        if (msg.dir === "in" && msg.ok && msg.path) {
          const fname = msg.path.split(/[\\\/]/).pop();
          const link = el("a", null, "Open");
          link.href = `/api/files/${encodeURIComponent(fname)}`;
          link.target = "_blank";
          b.appendChild(link);
        }
        b.appendChild(el("span", "when", fmtTime(msg.ts)));
        m.appendChild(b);
      }
    }
    m.scrollTop = m.scrollHeight;
  }

  // ── Render: files panel ────────────────────────────────────────────
  async function refreshFiles() {
    try {
      const { files } = await api.get("/api/files");
      const list = $("#filelist");
      list.innerHTML = "";
      $("#files-count").textContent = files.length;
      if (files.length === 0) {
        list.appendChild(el("div", "empty", "no files yet"));
        return;
      }
      for (const f of files) {
        const row = el("div", "file-row");
        row.appendChild(el("div", "icon", fileIcon(f.name)));
        const meta = el("div", "meta");
        meta.appendChild(el("div", "name", f.name));
        meta.appendChild(el("div", "size", `${fmtBytes(f.size)}`));
        row.appendChild(meta);
        const link = el("a", null, "Open");
        link.href = `/api/files/${encodeURIComponent(f.name)}`;
        link.target = "_blank";
        row.appendChild(link);
        list.appendChild(row);
      }
    } catch (e) { console.warn(e); }
  }

  // ── Selection ──────────────────────────────────────────────────────
  function selectPeer(shortId) {
    state.selectedPeer = shortId;
    const peer = state.peers.get(shortId);
    if (!peer) {
      $("#convo-empty").style.display = "grid";
      $("#convo-active").style.display = "none";
      return;
    }
    $("#convo-empty").style.display = "none";
    $("#convo-active").style.display = "flex";
    $("#convo-avatar").textContent = initials(peer.hostname || peer.short_id);
    $("#convo-name").textContent = peer.hostname || "(unknown)";
    $("#convo-sub").textContent = `${peer.short_id} · ${peer.address}:${peer.port}`;
    renderPeers();
    renderMessages();
    $("#input").focus();
    $("#drop-peer").textContent = peer.hostname || peer.short_id;
  }

  // ── Initial load ───────────────────────────────────────────────────
  async function init() {
    try {
      const me = await api.get("/api/me");
      state.me = me;
      $("#me-host").textContent = me.hostname;
      $("#me-id").textContent = me.short_id;
    } catch (e) {
      toast("Couldn't reach the daemon. Is it running?", "bad", 8000);
      console.error(e);
    }
    await refreshPeers();
    await loadHistory();
    connectWS();
    setInterval(refreshPeers, 5000);
  }

  async function refreshPeers() {
    try {
      const { peers } = await api.get("/api/peers");
      state.peers.clear();
      for (const p of peers) state.peers.set(p.short_id, p);
      renderPeers();
    } catch (e) { console.warn(e); }
  }

  async function loadHistory() {
    try {
      const { messages } = await api.get("/api/messages?limit=300");
      state.messages = messages;
      renderMessages();
    } catch (e) { console.warn(e); }
  }

  // ── WebSocket live events ──────────────────────────────────────────
  let ws = null;
  function connectWS() {
    try { if (ws) ws.close(); } catch {}
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/api/events`);
    ws.onmessage = (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "peers") {
        state.peers.clear();
        for (const p of m.peers) state.peers.set(p.short_id, p);
        renderPeers();
      } else if (m.type === "msg") {
        const msg = m.msg;
        state.messages.push(msg);
        if (state.messages.length > 1000) state.messages = state.messages.slice(-800);
        if (msg.t === "TEXT" && msg.dir === "in" && msg.peer !== state.selectedPeer) {
          const peer = state.peers.get(msg.peer);
          toast(`${peer?.hostname || msg.peer}: ${msg.body || ""}`, "info");
        }
        if (msg.t === "FILE_DONE" && msg.dir === "in" && msg.ok) {
          toast(`Received ${msg.name || "file"}`, "good");
          refreshFiles();
        }
        if (msg.peer === state.selectedPeer) renderMessages();
      }
    };
    ws.onclose = () => setTimeout(connectWS, 1500);
    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  // ── Send text ──────────────────────────────────────────────────────
  const input = $("#input");
  const sendBtn = $("#btn-send");
  input.addEventListener("input", () => {
    sendBtn.disabled = !input.value.trim() || !state.selectedPeer;
    input.style.height = "auto";
    input.style.height = Math.min(160, input.scrollHeight) + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendCurrent();
    }
  });
  sendBtn.addEventListener("click", sendCurrent);
  async function sendCurrent() {
    const body = input.value.trim();
    if (!body || !state.selectedPeer) return;
    sendBtn.disabled = true;
    try {
      await api.post("/api/send", { peer: state.selectedPeer, body });
      input.value = "";
      input.style.height = "auto";
    } catch (e) {
      toast(`Send failed: ${e.message || e}`, "bad");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ── Send file (button) ─────────────────────────────────────────────
  const fileInput = $("#file-input");
  const triggerAttach = () => {
    if (!state.selectedPeer) { toast("Pick a peer first", "info"); return; }
    fileInput.click();
  };
  $("#btn-attach").addEventListener("click", triggerAttach);
  $("#btn-attach2").addEventListener("click", triggerAttach);
  fileInput.addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []);
    fileInput.value = "";
    for (const f of files) await uploadFile(f);
  });

  async function uploadFile(file) {
    if (!state.selectedPeer) { toast("Pick a peer first", "info"); return; }
    toast(`Sending ${file.name}…`, "info");
    try {
      const r = await api.upload(state.selectedPeer, file);
      toast(`Sent ${file.name}`, "good");
    } catch (e) {
      toast(`Send failed: ${e.message || e}`, "bad", 6000);
    }
  }

  // ── Drag-drop ──────────────────────────────────────────────────────
  let dragCounter = 0;
  document.addEventListener("dragenter", (e) => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes("Files")) {
      dragCounter++;
      $("#drop-overlay").classList.add("show");
    }
  });
  document.addEventListener("dragover", (e) => { e.preventDefault(); });
  document.addEventListener("dragleave", () => {
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; $("#drop-overlay").classList.remove("show"); }
  });
  document.addEventListener("drop", async (e) => {
    e.preventDefault();
    dragCounter = 0;
    $("#drop-overlay").classList.remove("show");
    if (!state.selectedPeer) { toast("Pick a peer first", "info"); return; }
    const files = Array.from(e.dataTransfer?.files || []);
    for (const f of files) await uploadFile(f);
  });

  // ── Sidebar toggles ────────────────────────────────────────────────
  document.querySelectorAll(".side-foot .btn").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(".side-foot .btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      const pane = b.dataset.pane;
      if (pane === "files") {
        state.showFiles = true;
        $("#files-panel").style.display = "flex";
        $("#main").classList.add("with-files");
        refreshFiles();
      } else {
        state.showFiles = false;
        $("#files-panel").style.display = "none";
        $("#main").classList.remove("with-files");
      }
    };
  });

  init();
})();
</script>
</body>
</html>
