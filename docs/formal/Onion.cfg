\* TLC configuration for the onion-circuit state machine spec.
\* Small finite domain: 3 hops + 1 destination + 2 payloads,
\* with attacker action enabled.

SPECIFICATION Spec

CONSTANTS
    Hops           = {"r1", "r2", "r3", "dest"}
    PayloadValues  = {"p1", "p2"}
    AttackerOn     = TRUE

INVARIANTS
    NoLayerLeakage
    HopBlindness
    IntegrityOnRelay
    DeliveryFidelity
