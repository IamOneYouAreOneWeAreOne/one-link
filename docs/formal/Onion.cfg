\* TLC configuration for the onion-circuit state machine spec.
\* Small finite domain: 3 hops + 1 destination + 2 payloads,
\* with attacker action enabled.

SPECIFICATION Spec

CONSTANTS
    Relay1         = "r1"
    Relay2         = "r2"
    Relay3         = "r3"
    Destination    = "dest"
    PayloadValues  = {"p1", "p2"}
    AttackerOn     = TRUE

INVARIANTS
    TypeOK
    NoLayerLeakage
    HopBlindness
    IntegrityOnRelay
    DeliveryFidelity
