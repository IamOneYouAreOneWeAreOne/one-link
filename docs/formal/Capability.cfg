\* TLC config for Capability.tla. Small finite-state space so TLC
\* completes quickly. Production verification runs:
\*
\*   tlc -workers auto -config Capability.cfg Capability.tla
\*
\* on every change to the capability state machine.

SPECIFICATION Spec
INVARIANTS SafetyInvariants

CONSTANTS
    Granters = {g1, g2}
    Subjects = {s1, s2, s3}
    Scopes = {"files:read", "files:write"}
    RootKeys = {k1, k2}
    MaxClock = 5
