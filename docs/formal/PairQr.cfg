\* TLC configuration for the pair-by-QR state machine spec.
\* Small finite domain: 2 inviters, 1 scanner, 2 invites,
\* with attacker actions enabled (honest traces remain reachable).

SPECIFICATION Spec

CONSTANTS
    Inviters    = {"i1", "i2"}
    Scanners    = {"s1"}
    Invites     = {"inv1", "inv2"}
    AttackerOn  = TRUE

INVARIANTS
    StateTypesOk
    NoUnverifiedConfirm
    NoCrossInviteReplay
    SAS_AgreementOnHonestRun

\* Two invites preserve the cross-invite replay attack surface; one scanner
\* is sufficient to exercise it while keeping the blocking gate compact.
