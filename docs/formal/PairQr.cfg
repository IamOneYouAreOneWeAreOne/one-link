\* TLC configuration for the pair-by-QR state machine spec.
\* Small finite domain: 2 inviters, 2 scanners, 2 invites,
\* with and without attacker.

SPECIFICATION Spec

CONSTANTS
    Inviters    = {"i1", "i2"}
    Scanners    = {"s1", "s2"}
    Invites     = {"inv1", "inv2"}
    AttackerOn  = TRUE

INVARIANTS
    StateTypesOk
    NoUnverifiedConfirm
    NoCrossInviteReplay
    SAS_AgreementOnHonestRun

\* State explosion is bounded by the cross product of state names
\* (4 inviter * 3 scanner per identity) and wire-message subsets.
\* On a 64GB host TLC completes in <30s.
