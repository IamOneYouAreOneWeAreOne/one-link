[project]
name = "one_link"
version = "0.21.0-alpha"
description = "Peer-to-peer LAN chat + file sync built on the Coherence Language ecosystem."
requires-python = ">=3.11"
authors = [{ name = "One Link contributors", email = "weareone@oneunity.earth" }]
license = { text = "AGPL-3.0-or-later" }

dependencies = [
  # cryptography >= 44 is the first release that ships pre-built
  # win_arm64 wheels (and parallel wheels for linux_aarch64 /
  # macosx_arm64). The older >=42 floor would resolve to a version
  # without a Windows ARM64 wheel, fall through to a source build,
  # and fail on the GitHub-hosted win_arm64 runner because there is
  # no OpenSSL dev install on it. Bumping the floor removes the
  # entire failure class without changing behavior anywhere else.
  "cryptography>=44",
  "zeroconf>=0.130",
  "click>=8.1",
  "blake3>=0.4",
  "platformdirs>=4",
  "aiohttp>=3.13.4",
  "watchdog>=4.0",
  # v0.15.4: QR code rendering for the LAN-pairing flow. Pure-Python,
  # BSD-licensed (Lincoln Loop), SVG output without Pillow.
  "qrcode>=7",
  # v0.20.0: WebRTC DataChannel transport on the daemon side. Lets
  # browser-as-peer (the /peer page) connect to the desktop daemon
  # directly with sub-second LAN handshakes via DTLS-SRTP. Vendors
  # libsrtp + libav + libopenssl wheels — heavyweight but standard
  # for any cross-vendor WebRTC + the only realistic path for the
  # phone-as-peer endgame without writing our own ICE stack.
  #
  # Environment-marker SKIP on Windows ARM64: aiortc transitively
  # pulls in PyAV (the ``av`` package), which has no
  # cp3*-win_arm64 wheels in any release as of 2026-05. Source-
  # building it would need a full FFmpeg-dev install on the runner.
  # Excluding it on win_arm64 lets the daemon install cleanly there;
  # the browser-as-peer datachannel path degrades to "unsupported on
  # this binary" (LAN-only desktop↔desktop transfers still work
  # because they use our own QUIC + peer_rtc stack, not aiortc).
  # Re-enable automatically once PyAV ships win_arm64 wheels.
  "aiortc>=1.14; sys_platform != 'win32' or platform_machine != 'ARM64'",
  # v0.21.x at-rest encryption + OS keychain integration.
  # sqlcipher3 wraps SQLCipher (sqlite3 + AES-256 page encryption);
  # keyring abstracts Windows Credential Manager / macOS Keychain /
  # Linux Secret Service so the encryption key is auto-generated +
  # stored without prompting the user. Both are graceful-fallback:
  # if either fails to import at runtime, state.db falls back to
  # plaintext (legacy) mode + a WARNING log line.
  "sqlcipher3>=0.6",
  "keyring>=24",
]

[project.optional-dependencies]
# Native hot-path crates (chunk store, AEAD, WAL, QUIC, coherence-field).
# Prebuilt wheels ship in GitHub Releases per `.github/workflows/release.yml`.
# Users get the binary in seconds without needing Rust installed locally:
#
#     pip install one_link_native --find-links \
#       https://github.com/IamOneYouAreOneWeAreOne/one-link/releases/latest
#
# Or download the OS+arch-matching wheel from the release page and
# `pip install <wheel.whl>`. Source builds via `cd native && maturin build --release`.
native = ["one_link_native>=0.21,<1.0"]
window = ["pywebview>=5.0"]  # optional native-window wrapper (Tier 2)
# v0.10.5 system tray icon. Lets the daemon live in the OS tray
# instead of always-needing-a-browser-tab. Optional — fresh
# installs without these packages fall back to headless daemon
# mode automatically.
tray = ["pystray>=0.19", "pillow>=12.2.0"]
# v0.20.7 (sovereignty pack): route outbound rendezvous traffic
# through a SOCKS proxy when ONE_LINK_TOR_PROXY is set. Optional
# because pulling aiohttp-socks adds the python-socks transitive
# dep (~150KB) that users not running Tor never need.
tor = ["aiohttp-socks>=0.10"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  # v0.21.x property-based testing for invariants that span
  # huge input spaces (e.g. 'every BIP-39 seed round-trips';
  # 'every random message body is findable by every prefix
  # of every word in it'). Hypothesis runs 100-1000 generated
  # examples per test by default; the bug-class it catches is
  # 'I forgot to test the empty input / unicode edge / a value
  # that happens to be 256 bytes long' that example-based tests
  # systematically miss because the author didn't think of it.
  "hypothesis>=6.100",
]
# v0.21.x browser-driven E2E harness. Catches UI bugs that no
# amount of unit testing can: pixel overlap, iframe security
# headers blocking inline previews, click handlers that hijack
# disclosure widgets, dialog z-order regressions, etc. - the
# bug-class that pure code audits cannot see because they read
# the source, not the rendered pixels.
#
# Install: `pip install -e .[e2e]` THEN `playwright install
# chromium` once (fetches ~150 MB browser binaries). The CI
# job does this automatically.
e2e = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "playwright>=1.50",
  "pytest-playwright>=0.7",
]
# v0.7.2 supply-chain gates (audit finding C):
#   - pip-audit: scans the lockfile against the OSV vulnerability DB
#   - bandit: SAST for common Python issues (subprocess shell=True, etc)
#   - cyclonedx-bom: SBOM generator (CycloneDX JSON)
#   - pip-tools: reproducible lockfile regeneration via `pip-compile`
security = [
  "pip-audit>=2.7",
  "bandit>=1.7",
  "cyclonedx-bom>=4.4",
  "pip-tools>=7.4",
]

[project.scripts]
one-link = "one_link.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
one_link = [
  "native/*/ol_native_cdc.dll",
  "native/*/ol_native_cdc.so",
  "native/*/ol_native_cdc.dylib",
  "native/*/ol_native_cdc.dll.sha256",
  # v0.20.7 master-seed: BIP-39 English wordlist for the
  # 24-word recovery phrase encoding.
  "data/bip39-english.txt",
  # v0.20.7 (audit H7): JS Double Ratchet for browser-as-peer +
  # the in-browser self-test harness.
  "web/dr.js",
  "web/dr_test.html",
]

[tool.pytest.ini_options]
# Some globally installed pytest plugins perform Windows WMI platform probes at
# pytest_configure time. One Link's own perf lab is in-process and deterministic;
# we do not depend on pytest-benchmark, and disabling it keeps the test gate from
# hanging before collection on WMI-unhealthy machines.
addopts = "-p no:benchmark -p no:hypothesispytest"
# External audit 2026-05-18 ES-8: `soak` marker isolates the
# two-device regression gate (tests/test_two_device_soak.py) from
# the fast unit suite. Run with `pytest -m soak` before each ship.
markers = [
    "soak: slower two-device regression tests (run with -m soak)",
]

# Phase C-3 (ADR-0008): mypy resolves `one_link_native` types from the
# PEP 561 stub-only package shipped under `stubs/one_link_native-stubs/`.
#
# Mypy's stub-only package discovery looks for ``<name>-stubs`` next to
# the runtime ``<name>`` on ``sys.path`` (i.e. site-packages of the
# active interpreter). In-tree stubs on ``mypy_path`` are visible to
# the type checker but mypy still emits ``import-untyped`` on the
# runtime side because the ``py.typed`` marker has to live in the
# RUNTIME package (which is a compiled .pyd, no way to add a marker
# without rebuilding the wheel). The override below tells mypy to
# trust the stub package and skip the marker check.
#
# Single-file stubs that ARE on mypy_path (e.g. ``stubs/pystray.pyi``)
# resolve cleanly without an override — those don't run into the
# marker requirement.
[tool.mypy]
mypy_path = "stubs:src"
explicit_package_bases = true
namespace_packages = true
# Strict-ish defaults: every function body gets type-checked, even
# ones whose signatures lack annotations. Prevents the "untyped def
# silently hides errors" pattern from creeping back in.
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["one_link_native", "one_link_native.*"]
ignore_missing_imports = true

# v0.7.2 bandit config (audit finding C). We exclude tests because
# fake-data + pytest harness use patterns bandit flags but are safe
# in a test context (e.g. assert in tests, hardcoded keys for
# fixtures). Production code is fully scanned.
[tool.bandit]
exclude_dirs = ["tests", "scripts", ".venv", "build", "dist"]
# Skips: B101 (assert) is fine in production checks here; B404 (subprocess
# import) is unavoidable for the reveal-in-folder feature; B603 (subprocess
# without shell=True) is what we want, not what we avoid.
skips = ["B101", "B404", "B603"]
