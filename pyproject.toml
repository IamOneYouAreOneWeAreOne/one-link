[project]
name = "one_link"
version = "0.0.1"
description = "Peer-to-peer LAN chat + file sync built on the Coherence Language ecosystem."
requires-python = ">=3.11"
authors = [{ name = "One Link contributor", email = "weareone@oneunity.earth" }]
license = { text = "Proprietary" }

dependencies = [
  "cryptography>=42",
  "zeroconf>=0.130",
  "click>=8.1",
  "blake3>=0.4",
  "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
one-link = "one_link.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
