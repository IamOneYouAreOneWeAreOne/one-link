[package]
name = "ol_bloom"
version = "0.21.0-alpha.0"
edition = "2021"
description = "One Link file engine: content-addressed Bloom filter for transfer-init handshake (ADR-0011)"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_bloom"
crate-type = ["lib"]

[dependencies]
xxhash-rust = { workspace = true }
thiserror   = { workspace = true }
# Parallel bloom build for server-side bloom-handshake (collect_chunk_ids
# scans the full memtable; rayon parallelizes the (h1,h2) derivation
# across cores before the sequential bit-set pass).
rayon       = "1.10"

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }
hex       = { workspace = true }
rand      = { workspace = true }

[[bench]]
name    = "bloom_bench"
harness = false

[lints]
workspace = true
