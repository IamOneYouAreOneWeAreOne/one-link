[package]
name = "ol_fountain"
version = "0.22.0"
edition = "2021"
description = "One Link file engine: LT fountain codes per ADR-0015"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_fountain"
crate-type = ["lib"]

[dependencies]
blake3    = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
