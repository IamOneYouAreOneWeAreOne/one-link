[package]
name = "ol_erasure"
version = "0.22.1"
edition = "2021"
description = "One Link file engine: chunk-level erasure coding (RS over CDC chunks) per ADR-0018"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_erasure"
crate-type = ["lib"]

[dependencies]
ol_fec    = { path = "../ol_fec" }
blake3    = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }
rand      = { workspace = true }
hex       = { workspace = true }

[[bench]]
name    = "erasure_bench"
harness = false

[lints]
workspace = true
