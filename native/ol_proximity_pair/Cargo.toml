[package]
name = "ol_proximity_pair"
version = "0.22.0"
edition = "2021"
description = "Research primitives for a future channel-reciprocity pairing factor; not a complete authentication protocol."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_proximity_pair"
crate-type = ["lib"]

[dependencies]
thiserror = { workspace = true }
blake3    = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "pair_bench"
harness = false

[lints]
workspace = true
