[package]
name = "ol_winfs"
version = "0.21.0"
edition = "2021"
description = "One Link file engine: Windows filesystem surface scaffold (Dokan / WinFsp, Phase B layer 9)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_winfs"
crate-type = ["lib"]

[dependencies]
thiserror = { workspace = true }
ol_fuse   = { path = "../ol_fuse" }

# WinFsp is distributed under GPLv3 with its project-specific FLOSS
# exception and is also commercially licensed. Downstream packaging
# must verify that its chosen terms are compatible. These feature names
# are reserved compatibility gates only; neither adapter is linked yet.
[features]
default = []
winfsp = []
dokan = []

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
