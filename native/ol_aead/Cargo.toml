[package]
name = "ol_aead"
version = "0.21.0-alpha.0"
edition = "2021"
description = "One Link file engine: per-chunk AEAD pipeline (AES-256-GCM + ChaCha20-Poly1305 fallback) per ADR-0002"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_aead"
crate-type = ["lib"]

[dependencies]
ol_chunk         = { path = "../ol_chunk" }
# Phase C-3: AEAD primitives via `ring` (BoringSSL-derived hand-tuned
# assembly). Replaces RustCrypto's pure-Rust + intrinsics implementation,
# which was 1.5-2x slower than BoringSSL on small chunks. Same wire
# format (AES-256-GCM and ChaCha20-Poly1305 are RFC-specified — distinct
# implementations of the same algorithm produce byte-identical
# ciphertexts for the same (key, nonce, AAD, plaintext)), so this is
# a drop-in swap from the wire-compatibility POV.
ring             = { workspace = true }
blake3           = { workspace = true }
subtle           = { workspace = true }
zeroize          = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
# Parallel multi-chunk encrypt/decrypt path. Single-chunk paths stay
# sequential (4 frames at 16 KiB each is too few to amortize dispatch);
# the win lands when ingesting hundreds of chunks at once.
rayon            = "1.10"

[dev-dependencies]
proptest         = { workspace = true }
criterion        = { workspace = true }
hex              = { workspace = true }

[[bench]]
name    = "aead_bench"
harness = false

[lints]
workspace = true
