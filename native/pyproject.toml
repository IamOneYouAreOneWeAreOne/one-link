# One Link native — pyo3 binding crate package manifest.
#
# Per ADR-0008 (../docs/decisions/0008-ffi-contract.md). Built with
# maturin; produces a single wheel `one_link_native` containing the
# pyo3 .so/.pyd plus the canonical Python type stubs in
# `one_link_native/` package.

[build-system]
requires      = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name            = "one_link_native"
version         = "0.21.0a0"
description     = "One Link file engine v2: hot-path Rust crates exposed to Python"
readme          = "README.md"
license         = { text = "AGPL-3.0-or-later" }
authors         = [{ name = "One Link contributors", email = "weareone@oneunity.earth" }]
requires-python = ">=3.11"

# pyo3-built native module is the one classifier we need.
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Filesystems",
    "Topic :: Security :: Cryptography",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage      = "https://github.com/IamOne1/One_Link"
Documentation = "https://github.com/IamOne1/One_Link/tree/master/docs/decisions"
"Source Code" = "https://github.com/IamOne1/One_Link"

[tool.maturin]
# This is the pyo3 binding crate (matches the [package].name in
# one_link_native/Cargo.toml).
manifest-path = "one_link_native/Cargo.toml"
# Python module name. abi3 wheel: forward-compatible across Python 3.11+.
module-name   = "one_link_native"
# Every published wheel exposes the same Python ABI.  On Linux this
# additionally compiles the real fuser backend; ol_fuse's target-gated
# dependency makes the same feature a no-op (and never a readiness claim)
# on Windows and macOS.
features      = ["pyo3/extension-module", "pyo3/abi3-py311", "linux-mount"]
# Strip release builds for smaller wheels.
strip         = true
# Ship the complete PEP 561 inline package beside the generated PyO3 wrapper.
# Keeping source and wheel paths identical makes local and release type checks
# consume one canonical contract instead of silently choosing different stubs.
include       = [
    { path = "one_link_native/*.pyi", format = "wheel" },
    { path = "one_link_native/py.typed", format = "wheel" },
]
