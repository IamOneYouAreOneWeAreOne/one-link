[package]
name = "ol_fskit"
version = "0.22.0-alpha.0"
edition = "2021"
description = "One Link file engine: macOS FSKit filesystem surface scaffold (Phase B layer 9)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_fskit"
crate-type = ["lib"]

[dependencies]
thiserror = { workspace = true }
ol_fuse   = { path = "../ol_fuse" }

# FSKit is available beginning with macOS 15.4. `macos-mount` is a
# reserved compatibility gate only; no Swift/Objective-C app-extension
# adapter is currently linked, and enabling it must not report readiness.
[features]
default = []
macos-mount = []

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
