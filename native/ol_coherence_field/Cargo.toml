[package]
name = "ol_coherence_field"
version = "0.22.1"
edition = "2021"
description = "One Link file engine: coherence-field substrate (Phase E). Reaction-diffusion + Helmholtz reduction + Green-function nonlocal kernel + BE-RAR interpolation + apparent-horizon anchor. Shared with OneField Mesh + BioMesh — cross-domain calibration."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_coherence_field"
crate-type = ["lib"]

[dependencies]
thiserror = { workspace = true }

# rayon is unavailable on wasm32-unknown-unknown (no threads). The two
# parallel matvec helpers in src/pde/mod.rs are cfg-gated for wasm, and
# so is this dep. Native targets see no change.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon     = "1.10"

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "coherence_field_bench"
harness = false

[lints]
workspace = true
