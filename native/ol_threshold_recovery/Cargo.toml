[package]
name = "ol_threshold_recovery"
version = "0.22.0-alpha.0"
edition = "2021"
description = "One Link Coherence Mesh: Shamir threshold secret sharing with coherence-field-bound recovery (Phase F1, COHERENCE_MESH_PLAN.md)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_threshold_recovery"
crate-type = ["lib"]

[dependencies]
thiserror = { workspace = true }
# `Choice` stops LLVM from turning GF(256) arithmetic masks back into
# secret-dependent branches; the core barrier avoids an out-of-line call.
subtle    = { workspace = true, features = ["core_hint_black_box"] }
blake3    = { workspace = true }
rand_core = { workspace = true }
zeroize   = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "threshold_bench"
harness = false

[lints]
workspace = true
