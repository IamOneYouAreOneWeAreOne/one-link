[package]
name = "ol_fuse"
version = "0.21.0-alpha.0"
edition = "2021"
description = "One Link file engine: FUSE filesystem surface scaffold (Phase B, ADR pending)."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_fuse"
crate-type = ["lib"]

[dependencies]
thiserror = { workspace = true }
blake3    = { workspace = true }

# fuser is Linux-only and links against libfuse3. Pulling it on
# Windows/macOS breaks the workspace build, so it goes in the Linux-
# only target-cfg block below. Non-Linux platforms get a stub mount()
# returning ``MountError::UnsupportedPlatform``.
[target.'cfg(target_os = "linux")'.dependencies]
fuser     = { version = "0.15", optional = true }
libc      = { version = "0.2", optional = true }

[features]
# Default: scaffold only. Enabling `linux-mount` pulls in fuser + libc
# and switches `mount()` to the real `fuser::mount2` path. Daemon
# consumers opt in once the Linux distro packages libfuse3.
default = []
linux-mount = ["dep:fuser", "dep:libc"]

[dev-dependencies]
tempfile  = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "fuse_bench"
harness = false

[lints]
workspace = true
