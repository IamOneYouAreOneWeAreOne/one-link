[package]
name = "ol_capability"
version = "0.22.1"
edition = "2021"
description = "One Link file engine: macaroon-style capability layer per ADR-0021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_capability"
crate-type = ["lib"]

[dependencies]
blake3    = { workspace = true }
subtle    = { workspace = true }
zeroize   = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
rand      = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "capability_bench"
harness = false

[lints]
workspace = true
