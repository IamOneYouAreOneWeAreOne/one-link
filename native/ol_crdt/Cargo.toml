[package]
name = "ol_crdt"
version = "0.21.0"
edition = "2021"
description = "One Link file engine: CRDT shared folders per ADR-0022"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_crdt"
crate-type = ["lib"]

[dependencies]
blake3    = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
rand      = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "crdt_bench"
harness = false

[lints]
workspace = true
