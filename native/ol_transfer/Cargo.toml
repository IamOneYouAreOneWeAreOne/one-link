[package]
name = "ol_transfer"
version = "0.22.1"
edition = "2021"
description = "One Link file engine: TransferEngine wiring chunk_store + QUIC + Bloom-init per ADR-0013"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "ol_transfer"
crate-type = ["lib"]

[dependencies]
ol_chunk_store = { path = "../ol_chunk_store" }
ol_quic        = { path = "../ol_quic" }
ol_bloom       = { path = "../ol_bloom" }
ol_fountain    = { path = "../ol_fountain" }
ol_wal         = { path = "../ol_wal" }
blake3         = { workspace = true }
quinn          = { workspace = true }
tokio          = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
proptest       = { workspace = true }
criterion      = { workspace = true }
hex            = { workspace = true }
tempfile       = { workspace = true }
rand           = { workspace = true }
ol_chunk       = { path = "../ol_chunk" }
ol_aead        = { path = "../ol_aead" }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { workspace = true }

[[bench]]
name    = "transfer_bench"
harness = false

[lints]
workspace = true
