name: auto-build standalone binary

# Continuously-built standalone binary so "the newest" stops being
# "whatever Alex last rebuilt locally" and becomes "whatever the
# most recent green push to master produced."
#
# Differs from .github/workflows/release.yml (which fires only on
# `v*` tags and runs the full reproducible-build pipeline +
# Sigstore attestation): this one runs on every push, builds the
# PyInstaller standalone exe for each OS, and uploads it as a
# workflow artifact + as the assets of a rolling `latest` GitHub
# Release. The rolling release is intentionally NOT a tagged
# version — it tracks master's HEAD so users can grab the most
# recent build without waiting for a tagged version cut.
#
# Why this matters in practice: PyInstaller bundles index.html +
# all Python source AT BUILD TIME. A locally-running exe serves
# WHATEVER index.html it was built with, not the current source.
# Without an auto-build pipeline, every "I just fixed it" requires
# a manual `python scripts/build_binary.py --gui` + redistribute.
# With this workflow, every push produces a downloadable bundle.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Workflow-level concurrency: if a new push lands while a build is
# in flight, cancel the in-flight build. Keeps the rolling release
# pointing at master HEAD; avoids the awkward case where build N+1
# finishes before build N and the rolling release shows N.
concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write    # update the rolling `latest` release

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 30-minute cap per matrix leg. The previous setup had no
    # timeout, which combined with macos-13's deprecated-runner-pool
    # starvation (Intel-Mac hosted runners often sit "queued" for
    # hours and occasionally never land at all) meant a single stuck
    # leg blocked the entire workflow from concluding — the new
    # ``windows-installer`` + ``publish-rolling-latest`` jobs both
    # have ``if: always()`` to handle SOME leg failing, but
    # ``always()`` only fires when needs CONCLUDE, not when they sit
    # queued forever. A timeout turns "stuck" into "cancelled," the
    # build job concludes (with one leg's status: cancelled),
    # downstream jobs fire, the auto-latest release picks up whatever
    # zips/installers DID build. 30 min is generous for the longest
    # real build leg (windows-11-arm at ~9 min when warmed) and
    # short enough that a stuck queue gets caught within one cycle.
    timeout-minutes: 30
    strategy:
      # fail-fast=false so a single platform's hiccup (rare wheel
      # missing, a transient runner outage) does not torpedo the
      # other five legs.
      fail-fast: false
      matrix:
        include:
          # ── x86_64 — the historical baseline ──────────────────
          - os: windows-latest
            artifact-name: one-link-windows-x86_64
            exe-name: one-link.exe
          - os: ubuntu-latest
            artifact-name: one-link-linux-x86_64
            exe-name: one-link
          # macos-13 (Intel Mac) is NOT in this matrix. Intel runners
          # sit "queued" for a long time, and this workflow's
          # cancel-in-progress concurrency means every new push to
          # master would cancel a slow Intel leg before it published —
          # so the Intel dmg never landed. It now builds in a DECOUPLED
          # workflow (.github/workflows/auto_build_macos_intel.yml) with
          # its OWN non-cancelling concurrency group + a daily schedule,
          # so it publishes one-link-macos-x86_64.dmg to the same
          # auto-latest release whenever a runner frees up, without
          # blocking or being blocked by this fast multi-platform build.
          # ── arm64 — added to close the coverage gap ───────────
          - os: macos-latest
            artifact-name: one-link-macos-arm64
            exe-name: one-link
          # GitHub-hosted Linux ARM64 runner — GA Jan 2025, free
          # for public repos. Covers Raspberry Pi 4/5 (64-bit OS),
          # Apple Silicon under Asahi/UTM, and ARM cloud servers.
          - os: ubuntu-24.04-arm
            artifact-name: one-link-linux-arm64
            exe-name: one-link
          # GitHub-hosted Windows ARM64 runner — GA April 2025,
          # free for public repos. Covers Surface Pro X / Copilot+
          # ARM laptops (Snapdragon X / SQ3).
          - os: windows-11-arm
            artifact-name: one-link-windows-arm64
            exe-name: one-link.exe

    steps:
      - uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
            ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-auto-build-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-auto-build-

      - name: install Rust toolchain
        # Moved BEFORE pip install: cryptography has no win_arm64 wheel
        # in any release as of 2026-05, so on that leg ``pip install -e .``
        # falls through to a source build that invokes maturin which
        # invokes cargo. Without Rust available, the cryptography build
        # fails at "Failed to build a native library through cargo" and
        # we lose Windows ARM64 from the matrix. Installing Rust first
        # fixes that without affecting the other legs (where a binary
        # wheel resolves cleanly and Rust is just sitting there unused
        # until the ``build native crate from source`` step below).
        uses: dtolnay/rust-toolchain@stable

      - name: install OpenSSL on Windows ARM64 (cryptography build dep)
        # cryptography's Rust core links against openssl-sys, which
        # needs OpenSSL headers + libs at build time. The GitHub-
        # hosted windows-11-arm runner image does NOT ship OpenSSL by
        # default, and there is no published cp312-win_arm64 wheel
        # for cryptography that would avoid the source build. We
        # install OpenSSL STATICALLY via vcpkg's
        # ``arm64-windows-static`` triplet and set OPENSSL_STATIC=1
        # so the OpenSSL code is linked directly into
        # ``cryptography._rust.pyd``.
        #
        # Why static and not dynamic: a previous attempt with the
        # default dynamic triplet shipped libcrypto-3-arm64.dll +
        # libssl-3-arm64.dll alongside _rust.pyd, but at PyInstaller's
        # hook-import stage Windows resolved a different OpenSSL DLL
        # off PATH first, leading to "DLL load failed while importing
        # _rust: The specified procedure could not be found" — an ABI
        # mismatch between cryptography's expected OpenSSL
        # entrypoints and whatever was on PATH. Static linking
        # eliminates the DLL-resolution race entirely; PyInstaller
        # doesn't have to find or bundle OpenSSL DLLs because there
        # aren't any.
        #
        # First run on a cold runner: ~5-10 min while vcpkg compiles
        # static OpenSSL from source. Cache step below makes repeat
        # runs ~30 s.
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { throw "VCPKG_INSTALLATION_ROOT not set on this runner" }
          Write-Host "vcpkg at $vcpkg"
          & "$vcpkg\vcpkg.exe" install openssl:arm64-windows-static --recurse
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install openssl (static) failed (exit $LASTEXITCODE)" }
          $prefix = "$vcpkg\installed\arm64-windows-static"
          "OPENSSL_DIR=$prefix"                 | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_LIB_DIR=$prefix\lib"         | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_INCLUDE_DIR=$prefix\include" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_STATIC=1"                    | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_NO_VENDOR=1"                 | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "VCPKG_DEFAULT_TRIPLET=arm64-windows-static" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: cache vcpkg ARM64 OpenSSL build
        if: matrix.os == 'windows-11-arm'
        uses: actions/cache@v4
        with:
          # Hardcoded to ``C:\vcpkg`` — that is the canonical
          # vcpkg location on every GitHub-hosted Windows runner image
          # (matches the VCPKG_INSTALLATION_ROOT env var the previous
          # step reads). ``env.VCPKG_INSTALLATION_ROOT`` itself isn't a
          # workflow-declared env, so the IDE linter rejects it here
          # even though it works at runtime; hardcoding is also more
          # robust against transient image-config drift. Cache key
          # bumped to v2 because the triplet changed
          # (dynamic → static).
          path: |
            C:/vcpkg/installed/arm64-windows-static
            C:/vcpkg/packages/openssl_arm64-windows-static
          key: vcpkg-openssl-arm64-windows-static-v2

      - name: generate macOS .icns icon
        # PyInstaller's BUNDLE() block expects a .icns for the Dock
        # icon to render crisply at every size. Generated from the
        # existing PNG family via macOS-native iconutil + sips so the
        # repo never has to carry a pre-baked .icns next to the PNG
        # (which would drift the moment someone updated the source
        # art and forgot the regenerate step). Only runs on the
        # macOS legs; no-op everywhere else.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x packaging/macos/make_icns.sh
          packaging/macos/make_icns.sh

      - name: install build tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Install the project itself in editable mode so PyInstaller
          # can resolve every import path. On win_arm64 this triggers
          # the cryptography source build (Rust + OpenSSL must be
          # already in place — done in the two steps above).
          pip install -e .

      - name: cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-auto-build-${{ hashFiles('native/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-auto-build-

      - name: build native crate from source
        shell: bash
        continue-on-error: true
        # Build one_link_native locally with maturin instead of pulling
        # a published wheel. Previous approach used `pip install
        # one_link_native --find-links <github-release-html-url>`,
        # which never actually resolved a wheel because the URL points
        # at an HTML release page (not a pip-parseable index). That
        # meant every auto-build silently fell back to pure-Python.
        #
        # Building from source adds ~3-5 min per OS but produces a
        # bundle that includes the native fast paths (CDC, AEAD, QUIC,
        # capability, ratchet, coherence-field). The cache step above
        # makes incremental rebuilds much faster than this estimate.
        #
        # continue-on-error: a Rust-toolchain hiccup OR a maturin
        # version skew should never block the standalone exe build —
        # the standalone exe is tolerant of pure-Python fallback and
        # the user-facing chat / file paths work either way.
        run: |
          pip install maturin
          cd native/one_link_native
          maturin develop --release \
            || echo "maturin build failed; auto-build will ship pure-Python"

      - name: build the standalone binary
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # --allow-native-cdc-fallback: the native CDC scanner is an
          # OPTIONAL accelerator — the app runs correctly in pure
          # Python without it (same philosophy as the maturin/Rust
          # crate, which already ships pure-Python on build failure).
          # Without this flag a flaky gcc compile (cold-runner timeout)
          # hard-failed the whole installer build, blocking every
          # download. The fallback ships a working pure-Python
          # installer instead of nothing.
          python scripts/build_binary.py --gui --allow-native-cdc-fallback

      - name: stamp build metadata
        shell: bash
        run: |
          # A small marker file in the bundle so a user looking at
          # dist/one-link/ can tell which commit they're running.
          mkdir -p dist/one-link
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ${{ matrix.os }}"
          } > dist/one-link/BUILD_INFO.txt

      - name: compute SHA-256 of the bundle
        shell: bash
        run: |
          cd dist
          # macOS uses shasum; Windows + Linux use sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            find one-link -type f -print0 | sort -z \
              | xargs -0 sha256sum > one-link.sha256
          else
            find one-link -type f -print0 | sort -z \
              | xargs -0 shasum -a 256 > one-link.sha256
          fi
          # Also produce a single-file digest of the main exe so
          # users on the GitHub Releases page can quick-verify.
          if [ -f "one-link/${{ matrix.exe-name }}" ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "one-link/${{ matrix.exe-name }}" \
                > "one-link/${{ matrix.exe-name }}.sha256"
            else
              shasum -a 256 "one-link/${{ matrix.exe-name }}" \
                > "one-link/${{ matrix.exe-name }}.sha256"
            fi
          fi

      - name: package bundle as a zip
        shell: bash
        run: |
          cd dist
          # Zip the whole onedir bundle. zip works on Windows runners
          # via the built-in `zip` (Git Bash) or PowerShell fallback.
          if command -v zip >/dev/null 2>&1; then
            zip -r ${{ matrix.artifact-name }}.zip one-link
          else
            powershell -Command "Compress-Archive -Path one-link -DestinationPath ${{ matrix.artifact-name }}.zip"
          fi

      - name: package Linux .AppImage
        # AppImage is the most universal Linux install format — a
        # single self-contained executable that runs across Ubuntu,
        # Debian, Fedora, Arch, etc. without dependency-hell or
        # root install. We produce one per arch (x86_64 + aarch64);
        # the user downloads, chmod +x, double-click. No package
        # manager, no telemetry, no system mutation.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # AppImage convention: aarch64, not arm64.
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            APPIMAGE_ARCH="aarch64"
          else
            APPIMAGE_ARCH="x86_64"
          fi
          OUT="dist/${{ matrix.artifact-name }}.AppImage"
          chmod +x packaging/linux/make_appimage.sh
          packaging/linux/make_appimage.sh \
            "dist/one-link" \
            "$OUT" \
            "$APPIMAGE_ARCH"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: package macOS .dmg
        # The PyInstaller spec now emits a BUNDLE() block on macOS so
        # dist/one-link.app/ exists as a proper .app bundle. Wrap it
        # in a compressed read-only .dmg with a /Applications symlink
        # — that's the canonical "drag the app to Applications"
        # install gesture every Mac user knows. hdiutil + ditto +
        # iconutil are all built-in macOS tools; no homebrew, no extra
        # CI install step.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          DMG_NAME="${{ matrix.artifact-name }}.dmg"
          chmod +x ../packaging/macos/make_dmg.sh
          ../packaging/macos/make_dmg.sh \
            "one-link.app" \
            "$DMG_NAME" \
            "One Link"
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

      - name: sign + notarize macOS .dmg (if Apple secrets are present)
        # Opt-in via repo secrets. APPLE_DEVELOPER_ID names the
        # Developer ID Application certificate ("Developer ID
        # Application: <Name> (TEAMID)"); APPLE_CERT_P12_BASE64 +
        # APPLE_CERT_P12_PASSWORD carry the .p12 export of that cert
        # so the runner can sign in-process. APPLE_NOTARY_USER +
        # APPLE_NOTARY_TEAM_ID + APPLE_NOTARY_APP_PWD authenticate
        # to Apple's notary service. Without these secrets the .dmg
        # ships unsigned + un-notarized (users hit "right-click →
        # Open" once on first launch) — everything still WORKS, the
        # first-run UX is just bumpier.
        #
        # When secrets ARE configured, every push gets a signed +
        # notarized .dmg with a stapled ticket so Gatekeeper
        # validates offline. ~$99/yr Apple Developer Program
        # membership unlocks this for the whole org. Until that's
        # bought, the env block resolves to empty strings and the
        # step early-exits — same documented-and-safe pattern the
        # Windows signing step uses.
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_PWD: ${{ secrets.APPLE_NOTARY_APP_PWD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_DEVELOPER_ID:-}" ] || [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "[sign] Apple signing secrets not configured — shipping unsigned"
            exit 0
          fi
          # Import the .p12 into a fresh keychain so we never touch
          # the runner's default keychain (avoids cert poisoning if
          # the cleanup step races).
          KCHAIN="$RUNNER_TEMP/build.keychain"
          KCHAIN_PWD="$(openssl rand -hex 24)"
          security create-keychain -p "$KCHAIN_PWD" "$KCHAIN"
          security set-keychain-settings -lut 21600 "$KCHAIN"
          security unlock-keychain -p "$KCHAIN_PWD" "$KCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KCHAIN" \
            -P "$APPLE_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCHAIN_PWD" "$KCHAIN"
          # Sign the .app bundle with hardened-runtime + a timestamp.
          codesign --deep --force --options runtime --timestamp \
            --sign "$APPLE_DEVELOPER_ID" \
            "dist/one-link.app"
          # Sign the .dmg itself (Apple requires signed disk images
          # for notarization).
          codesign --force --sign "$APPLE_DEVELOPER_ID" --timestamp \
            "dist/${{ matrix.artifact-name }}.dmg"
          # Notarize. ``notarytool submit --wait`` blocks until Apple
          # finishes (usually 1-5 min) and exits non-zero on failure.
          if [ -n "${APPLE_NOTARY_USER:-}" ] && [ -n "${APPLE_NOTARY_APP_PWD:-}" ]; then
            xcrun notarytool submit "dist/${{ matrix.artifact-name }}.dmg" \
              --apple-id "$APPLE_NOTARY_USER" \
              --team-id "$APPLE_NOTARY_TEAM_ID" \
              --password "$APPLE_NOTARY_APP_PWD" \
              --wait
            # Staple the notarization ticket so Gatekeeper validates
            # offline — users can open the .dmg with no internet.
            xcrun stapler staple "dist/${{ matrix.artifact-name }}.dmg"
          else
            echo "[sign] notarization secrets not present — signed but un-notarized .dmg"
          fi
          # Clean up.
          security delete-keychain "$KCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/${{ matrix.artifact-name }}.zip
            dist/${{ matrix.artifact-name }}.dmg
            dist/${{ matrix.artifact-name }}.dmg.sha256
            dist/${{ matrix.artifact-name }}.AppImage
            dist/${{ matrix.artifact-name }}.AppImage.sha256
            dist/one-link.sha256
          if-no-files-found: warn
          retention-days: 30

  # ─── Windows installer (Inno Setup) ──────────────────────────────────
  # A real Windows installer per architecture so end users get
  # "double-click, Next, install, Start Menu shortcut, done" instead
  # of "extract zip into Downloads, hunt for the exe, hope it works."
  # Per-user install path → no UAC prompt. Inno Setup is pre-installed
  # on the GitHub-hosted Windows runner images.
  windows-installer:
    name: windows installer (${{ matrix.arch }})
    needs: build
    runs-on: windows-latest
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact-name: one-link-windows-x86_64
            installer-name: one-link-setup-x86_64
          - arch: arm64
            artifact-name: one-link-windows-arm64
            installer-name: one-link-setup-arm64
    steps:
      - uses: actions/checkout@v4

      - name: download the windows binary artifact
        id: dl
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact-name }}
          path: payload-zip

      - name: skip when this arch did not build
        id: gate
        shell: pwsh
        run: |
          if (-not (Test-Path "payload-zip/${{ matrix.artifact-name }}.zip")) {
            Write-Host "::warning::no payload for ${{ matrix.arch }} — skipping installer build"
            "go=skip" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          } else {
            "go=ok" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          }

      - name: extract payload
        if: steps.gate.outputs.go == 'ok'
        shell: pwsh
        run: |
          Expand-Archive -Path "payload-zip/${{ matrix.artifact-name }}.zip" -DestinationPath "payload" -Force
          # The zip's top-level dir is ``one-link/`` (per build_binary.py).
          # The Inno script's PayloadDir default points at it.
          Get-ChildItem -Recurse payload | Select-Object -First 5 | Format-Table

      - name: compute version stamp
        id: ver
        shell: pwsh
        run: |
          # Two version strings serve two different purposes:
          #
          #  * ``full`` is shown to humans in Add/Remove Programs and
          #    in the AppVersion field. Carries pre-release suffix +
          #    short SHA so untagged auto-latest builds say what
          #    commit they came from.
          #  * ``numeric`` is the strict 4-part W.X.Y.Z that the
          #    Windows VS_VERSIONINFO resource header demands. The
          #    Inno Setup compiler rejects anything else for
          #    VersionInfoVersion. Strip pre-release tags + pad to 4
          #    parts, never letting through a hyphen / plus / letter.
          $sha = "${{ github.sha }}".Substring(0,7)
          $base = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $base) { $base = "0.21.0-alpha" }
          $full = "$base+sha.$sha"
          # Extract leading numeric ``X.Y.Z`` from the pyproject version
          # (drops -alpha / -rc1 / +build-meta), then right-pad to
          # exactly four dotted components.
          $numericMatch = [regex]::Match($base, '^(\d+(?:\.\d+){0,3})')
          $numeric = if ($numericMatch.Success) { $numericMatch.Groups[1].Value } else { "0.0.0" }
          $parts = $numeric.Split('.')
          while ($parts.Length -lt 4) { $parts += '0' }
          $numeric = $parts[0..3] -join '.'
          Write-Host "version full   : $full"
          Write-Host "version numeric: $numeric"
          "version=$full"          | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          "numeric=$numeric"       | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8

      - name: compile installer with Inno Setup
        if: steps.gate.outputs.go == 'ok'
        shell: pwsh
        run: |
          # ISCC.exe ships pre-installed on windows-latest. The
          # /D flags override .iss script defines so a single .iss
          # produces both x86_64 + arm64 installers.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw "ISCC.exe (Inno Setup compiler) not found on runner" }
          & $iscc `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DMyAppNumericVersion=${{ steps.ver.outputs.numeric }}" `
            "/DPayloadDir=$(Resolve-Path payload/one-link)" `
            "/DOutputBaseName=${{ matrix.installer-name }}" `
            "/DOutputDir=$(Resolve-Path .)/installer-out" `
            packaging/windows/one-link.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem installer-out

      - name: sign installer (if signing secrets are present)
        if: steps.gate.outputs.go == 'ok'
        shell: pwsh
        # Opt-in code-signing infrastructure. These secrets do NOT
        # need to be configured for the build to succeed — when they
        # are absent the step inside the shell early-exits and the
        # installer ships unsigned (users hit SmartScreen "Run
        # anyway" on first install but everything still works). The
        # IDE linter flags ``secrets.CSC_LINK`` as
        # "Context access might be invalid" because it cannot tell
        # whether the secret exists in the repo; that warning is the
        # documented behavior and is safe to ignore. To turn signing
        # on:
        #   1. Buy an Authenticode certificate (~$100-400/yr).
        #   2. Export the .pfx, base64-encode it
        #      (``base64 -w 0 cert.pfx > cert.b64``).
        #   3. Set repo secret CSC_LINK to the base64 string + secret
        #      CSC_KEY_PASSWORD to the .pfx password.
        # GitHub Actions resolves undefined secrets to empty strings
        # rather than failing the workflow, so the env block stays
        # safe with or without the secrets present.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Signing is OPT-IN via repo secrets. When CSC_LINK + the
          # password are configured, every installer + the inner exe
          # gets signed with Authenticode + a timestamp from the
          # DigiCert RFC 3161 server. Without the secrets, this step
          # is a no-op so anyone forking + building doesn't need a
          # certificate. The signing key NEVER leaves the runner;
          # it's decoded from a base64-encoded .pfx in the secret,
          # used in-process, then the .pfx is shredded.
          if (-not $env:CSC_LINK) {
            Write-Host "signing secrets not present — skipping signing (build is unsigned)"
            exit 0
          }
          $pfx = "$env:RUNNER_TEMP\cs.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CSC_LINK))
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          # Sign the installer + every .exe inside the bundle.
          $targets = @(Get-ChildItem installer-out -Filter *.exe -Recurse) `
                   + @(Get-ChildItem payload/one-link -Filter *.exe -Recurse)
          foreach ($t in $targets) {
            & $signtool sign /fd SHA256 /f $pfx /p $env:CSC_KEY_PASSWORD `
                /tr http://timestamp.digicert.com /td SHA256 /v $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($t.FullName)" }
          }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - name: upload installer
        if: steps.gate.outputs.go == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.installer-name }}
          path: installer-out/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-rolling-latest:
    name: publish rolling `latest` release
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    # ``always()`` makes this job publish even if one or more matrix
    # legs failed or were cancelled. Previously the default behavior
    # ("only run if needs succeeded") meant a single stuck or
    # cancelled leg blocked every release. The Intel-Mac runner
    # (macos-13) is a deprecated image with very limited capacity
    # and routinely sits in "queued" for hours, which kept blocking
    # auto-latest from updating with every other platform's
    # successful binary. Now: as long as ANY leg uploaded a zip,
    # users get a refreshed release containing whatever succeeded.
    # The release body lists the included platforms so users can see
    # which one was skipped.
    if: always() && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: flatten + manifest
        shell: bash
        run: |
          mkdir -p out
          # Collect every distributable into out/: .zip portable
          # bundles, .dmg macOS disk images, .AppImage Linux single-
          # file executables, .exe Windows installers, plus the
          # side-car .sha256 hashes for each.
          find artifacts -name '*.zip' -exec cp {} out/ \;
          find artifacts -name '*.dmg' -exec cp {} out/ \;
          find artifacts -name '*.AppImage' -exec cp {} out/ \;
          find artifacts -name '*.sha256' -exec cp {} out/ \;
          find artifacts -name 'one-link-setup-*.exe' -exec cp {} out/ \;
          # Guard: if no zips landed (every leg failed/was queued out),
          # there is nothing to publish. Exit cleanly so the release
          # action doesn't fire on an empty payload — better to skip
          # this push than to publish a zero-asset release that
          # overwrites the previous good auto-latest.
          if ! ls out/*.zip > /dev/null 2>&1; then
            echo "NO ZIPS to publish — every build leg failed or was queued. Skipping."
            echo "publish=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Build a consolidated manifest mapping artifact → SHA256.
          # This lets a verifier `curl <release>/manifest.txt` and
          # cross-check every download in one read.
          cd out
          # Hash everything a user might download — zips, dmgs,
          # installer .exes. The side-car .sha256 files are per-file
          # convenience; manifest.txt is the consolidated one.
          for f in *.zip *.dmg *.AppImage one-link-setup-*.exe; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> manifest.txt
            else
              shasum -a 256 "$f" >> manifest.txt
            fi
          done
          echo "publish=ok" >> "$GITHUB_OUTPUT"
          ls -la
          cat manifest.txt
        id: prepare

      - name: update rolling latest release
        if: steps.prepare.outputs.publish == 'ok'
        # The action upserts a release tagged `auto-latest` so users
        # can grab the most recent build from a stable URL. Releases
        # cut from `v*` tags via .github/workflows/release.yml are
        # NOT affected — that pipeline runs in parallel and produces
        # signed reproducible artifacts on its own schedule.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-latest
          name: "Rolling build (master ${{ github.sha }})"
          body: |
            **Automated continuous build from `master`.**

            This release tracks the tip of `master` and is overwritten on
            every push. It is _not_ a tagged version — for that, see the
            `v*` tagged releases produced by `release.yml`.

            **Commit:** ${{ github.sha }}
            **Built at:** ${{ github.event.head_commit.timestamp }}
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Verifying

            Each `*.zip` ships a `*.sha256` next to it; `manifest.txt`
            collates every artifact's hash so one fetch covers every
            platform. Cross-check before extracting:

            ```bash
            curl -sLO <release_url>/manifest.txt
            sha256sum --check manifest.txt
            ```

            ### Install

            **Windows (recommended):** download `one-link-setup-x86_64.exe`
            (or `one-link-setup-arm64.exe` for Snapdragon-X / Surface Pro X)
            and double-click. Per-user install, no UAC prompt, Start
            Menu shortcut. Uninstall via "Add or Remove Programs."

            **macOS (recommended):** download `one-link-macos-arm64.dmg`
            (Apple Silicon) or `one-link-macos-x86_64.dmg` (Intel),
            double-click, drag One Link into Applications. First
            launch may need right-click → Open to bypass Gatekeeper
            until Apple-notarization secrets are configured upstream.

            **Linux (recommended):** download
            `one-link-linux-x86_64.AppImage` (Intel/AMD) or
            `one-link-linux-arm64.AppImage` (Raspberry Pi /
            ARM cloud), then `chmod +x` and double-click. Single
            file, runs across every distro, no root, no package
            manager.

            **Portable Windows / Mac / Linux:** download the matching
            `.zip`. Unzip, then `chmod +x one-link && ./one-link` on
            POSIX, or double-click `one-link.exe` on Windows.

            No telemetry, no accounts, no servers. Quit via the tray
            icon to stop the daemon.

            ### What's bundled

            * Python daemon + all stdlib-only deps frozen via PyInstaller
            * The Rust native crate where a wheel was available for this
              OS (`one_link_native`). On runners without a published
              wheel, the bundle falls back to the pure-Python transport
              paths transparently.
            * The current `src/one_link/web/index.html` UI baked in.
            * `BUILD_INFO.txt` inside the bundle records the source
              commit + build time + runner OS.
          prerelease: true
          make_latest: false
          files: |
            out/*.zip
            out/*.dmg
            out/*.AppImage
            out/one-link-setup-*.exe
            out/*.sha256
            out/manifest.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
