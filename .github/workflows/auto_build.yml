name: auto-build standalone binary

# Continuously-built standalone binary so "the newest" stops being
# "whatever Alex last rebuilt locally" and becomes "whatever the
# most recent green push to master produced."
#
# Differs from .github/workflows/release.yml (which fires only on
# `v*` tags and runs the full reproducible-build pipeline +
# Sigstore attestation): this one runs on every push, builds the
# PyInstaller standalone exe for each OS, and uploads it as a
# workflow artifact + as the assets of a rolling `latest` GitHub
# Release. The rolling release is intentionally NOT a tagged
# version — it tracks master's HEAD so users can grab the most
# recent build without waiting for a tagged version cut.
#
# Why this matters in practice: PyInstaller bundles index.html +
# all Python source AT BUILD TIME. A locally-running exe serves
# WHATEVER index.html it was built with, not the current source.
# Without an auto-build pipeline, every "I just fixed it" requires
# a manual `python scripts/build_binary.py --gui` + redistribute.
# With this workflow, every push produces a downloadable bundle.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Workflow-level concurrency: if a new push lands while a build is
# in flight, cancel the in-flight build. Keeps the rolling release
# pointing at master HEAD; avoids the awkward case where build N+1
# finishes before build N and the rolling release shows N.
concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write    # update the rolling `latest` release

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast=false so a single platform's hiccup (rare wheel
      # missing, a transient runner outage) does not torpedo the
      # other five legs.
      fail-fast: false
      matrix:
        include:
          # ── x86_64 — the historical baseline ──────────────────
          - os: windows-latest
            artifact-name: one-link-windows-x86_64
            exe-name: one-link.exe
          - os: ubuntu-latest
            artifact-name: one-link-linux-x86_64
            exe-name: one-link
          # macOS Intel. ``macos-13`` is the last Intel-capable
          # GitHub-hosted macOS image; macos-14+ are Apple Silicon.
          # Apple's runner deprecation timeline keeps macos-13
          # available through at least 2026; revisit if/when GitHub
          # announces sunset. Covers Intel Macs (pre-M1) that the
          # arm64 build does not run on natively.
          - os: macos-13
            artifact-name: one-link-macos-x86_64
            exe-name: one-link
          # ── arm64 — added to close the coverage gap ───────────
          - os: macos-latest
            artifact-name: one-link-macos-arm64
            exe-name: one-link
          # GitHub-hosted Linux ARM64 runner — GA Jan 2025, free
          # for public repos. Covers Raspberry Pi 4/5 (64-bit OS),
          # Apple Silicon under Asahi/UTM, and ARM cloud servers.
          - os: ubuntu-24.04-arm
            artifact-name: one-link-linux-arm64
            exe-name: one-link
          # GitHub-hosted Windows ARM64 runner — GA April 2025,
          # free for public repos. Covers Surface Pro X / Copilot+
          # ARM laptops (Snapdragon X / SQ3).
          - os: windows-11-arm
            artifact-name: one-link-windows-arm64
            exe-name: one-link.exe

    steps:
      - uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
            ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-auto-build-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-auto-build-

      - name: install Rust toolchain
        # Moved BEFORE pip install: cryptography has no win_arm64 wheel
        # in any release as of 2026-05, so on that leg ``pip install -e .``
        # falls through to a source build that invokes maturin which
        # invokes cargo. Without Rust available, the cryptography build
        # fails at "Failed to build a native library through cargo" and
        # we lose Windows ARM64 from the matrix. Installing Rust first
        # fixes that without affecting the other legs (where a binary
        # wheel resolves cleanly and Rust is just sitting there unused
        # until the ``build native crate from source`` step below).
        uses: dtolnay/rust-toolchain@stable

      - name: install OpenSSL on Windows ARM64 (cryptography build dep)
        # cryptography's Rust core links against openssl-sys, which needs
        # OpenSSL headers + libs at build time. The GitHub-hosted
        # windows-11-arm runner image does NOT ship OpenSSL by default,
        # and there is no published cp312-win_arm64 wheel for
        # cryptography that would avoid the source build. We install
        # OpenSSL via vcpkg and export OPENSSL_DIR / OPENSSL_LIB_DIR /
        # OPENSSL_INCLUDE_DIR so the subsequent pip install finds it.
        #
        # First run on a cold runner takes ~5-10 min while vcpkg
        # compiles OpenSSL ARM64 from source; the cache step below
        # turns subsequent runs into a ~30 s install. Cost is paid
        # once per cache-key-invalidating change.
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { throw "VCPKG_INSTALLATION_ROOT not set on this runner" }
          Write-Host "vcpkg at $vcpkg"
          & "$vcpkg\vcpkg.exe" install openssl:arm64-windows --recurse
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install openssl failed (exit $LASTEXITCODE)" }
          $prefix = "$vcpkg\installed\arm64-windows"
          "OPENSSL_DIR=$prefix"               | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_LIB_DIR=$prefix\lib"       | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_INCLUDE_DIR=$prefix\include" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_NO_VENDOR=1"               | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          # Make OpenSSL DLLs visible to subsequent steps so
          # PyInstaller's dep-walker picks them up.
          "$prefix\bin" | Out-File -Append $env:GITHUB_PATH -Encoding utf8

      - name: cache vcpkg ARM64 OpenSSL build
        if: matrix.os == 'windows-11-arm'
        uses: actions/cache@v4
        with:
          # Hardcoded to ``C:\vcpkg`` — that is the canonical
          # vcpkg location on every GitHub-hosted Windows runner image
          # (matches the VCPKG_INSTALLATION_ROOT env var the previous
          # step reads). ``env.VCPKG_INSTALLATION_ROOT`` itself isn't a
          # workflow-declared env, so the IDE linter rejects it here
          # even though it works at runtime; hardcoding is also more
          # robust against transient image-config drift.
          path: |
            C:/vcpkg/installed/arm64-windows
            C:/vcpkg/packages/openssl_arm64-windows
          key: vcpkg-openssl-arm64-windows-v1

      - name: install build tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Install the project itself in editable mode so PyInstaller
          # can resolve every import path. On win_arm64 this triggers
          # the cryptography source build (Rust + OpenSSL must be
          # already in place — done in the two steps above).
          pip install -e .

      - name: cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-auto-build-${{ hashFiles('native/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-auto-build-

      - name: build native crate from source
        shell: bash
        continue-on-error: true
        # Build one_link_native locally with maturin instead of pulling
        # a published wheel. Previous approach used `pip install
        # one_link_native --find-links <github-release-html-url>`,
        # which never actually resolved a wheel because the URL points
        # at an HTML release page (not a pip-parseable index). That
        # meant every auto-build silently fell back to pure-Python.
        #
        # Building from source adds ~3-5 min per OS but produces a
        # bundle that includes the native fast paths (CDC, AEAD, QUIC,
        # capability, ratchet, coherence-field). The cache step above
        # makes incremental rebuilds much faster than this estimate.
        #
        # continue-on-error: a Rust-toolchain hiccup OR a maturin
        # version skew should never block the standalone exe build —
        # the standalone exe is tolerant of pure-Python fallback and
        # the user-facing chat / file paths work either way.
        run: |
          pip install maturin
          cd native/one_link_native
          maturin develop --release \
            || echo "maturin build failed; auto-build will ship pure-Python"

      - name: build the standalone binary
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/build_binary.py --gui

      - name: stamp build metadata
        shell: bash
        run: |
          # A small marker file in the bundle so a user looking at
          # dist/one-link/ can tell which commit they're running.
          mkdir -p dist/one-link
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ${{ matrix.os }}"
          } > dist/one-link/BUILD_INFO.txt

      - name: compute SHA-256 of the bundle
        shell: bash
        run: |
          cd dist
          # macOS uses shasum; Windows + Linux use sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            find one-link -type f -print0 | sort -z \
              | xargs -0 sha256sum > one-link.sha256
          else
            find one-link -type f -print0 | sort -z \
              | xargs -0 shasum -a 256 > one-link.sha256
          fi
          # Also produce a single-file digest of the main exe so
          # users on the GitHub Releases page can quick-verify.
          if [ -f "one-link/${{ matrix.exe-name }}" ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "one-link/${{ matrix.exe-name }}" \
                > "one-link/${{ matrix.exe-name }}.sha256"
            else
              shasum -a 256 "one-link/${{ matrix.exe-name }}" \
                > "one-link/${{ matrix.exe-name }}.sha256"
            fi
          fi

      - name: package bundle as a zip
        shell: bash
        run: |
          cd dist
          # Zip the whole onedir bundle. zip works on Windows runners
          # via the built-in `zip` (Git Bash) or PowerShell fallback.
          if command -v zip >/dev/null 2>&1; then
            zip -r ${{ matrix.artifact-name }}.zip one-link
          else
            powershell -Command "Compress-Archive -Path one-link -DestinationPath ${{ matrix.artifact-name }}.zip"
          fi

      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/${{ matrix.artifact-name }}.zip
            dist/one-link.sha256
          if-no-files-found: error
          retention-days: 30

  publish-rolling-latest:
    name: publish rolling `latest` release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: flatten + manifest
        shell: bash
        run: |
          mkdir -p out
          # Collect every zip + sha file into one out/ directory.
          find artifacts -name '*.zip' -exec cp {} out/ \;
          find artifacts -name '*.sha256' -exec cp {} out/ \;
          # Build a consolidated manifest mapping artifact → SHA256.
          # This lets a verifier `curl <release>/manifest.txt` and
          # cross-check every download in one read.
          cd out
          for f in *.zip; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> manifest.txt
            else
              shasum -a 256 "$f" >> manifest.txt
            fi
          done
          ls -la
          cat manifest.txt

      - name: update rolling latest release
        # The action upserts a release tagged `auto-latest` so users
        # can grab the most recent build from a stable URL. Releases
        # cut from `v*` tags via .github/workflows/release.yml are
        # NOT affected — that pipeline runs in parallel and produces
        # signed reproducible artifacts on its own schedule.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-latest
          name: "Rolling build (master ${{ github.sha }})"
          body: |
            **Automated continuous build from `master`.**

            This release tracks the tip of `master` and is overwritten on
            every push. It is _not_ a tagged version — for that, see the
            `v*` tagged releases produced by `release.yml`.

            **Commit:** ${{ github.sha }}
            **Built at:** ${{ github.event.head_commit.timestamp }}
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Verifying

            Each `*.zip` ships a `*.sha256` next to it; `manifest.txt`
            collates every artifact's hash so one fetch covers every
            platform. Cross-check before extracting:

            ```bash
            curl -sLO <release_url>/manifest.txt
            sha256sum --check manifest.txt
            ```

            ### Install

            1. Download the zip for your OS.
            2. Unzip into a folder you control.
            3. Double-click `one-link` / `one-link.exe`.

            No installer, no admin, no telemetry. Quit via the tray icon
            to stop the daemon.

            ### What's bundled

            * Python daemon + all stdlib-only deps frozen via PyInstaller
            * The Rust native crate where a wheel was available for this
              OS (`one_link_native`). On runners without a published
              wheel, the bundle falls back to the pure-Python transport
              paths transparently.
            * The current `src/one_link/web/index.html` UI baked in.
            * `BUILD_INFO.txt` inside the bundle records the source
              commit + build time + runner OS.
          prerelease: true
          make_latest: false
          files: |
            out/*.zip
            out/*.sha256
            out/manifest.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
