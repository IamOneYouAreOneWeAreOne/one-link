name: security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # weekly Tuesday 06:00 UTC — catch newly-published OSV records
    # against existing dependencies even when nothing in the repo
    # has changed. Same cadence as most upstream advisories.
    - cron: "0 6 * * 2"

jobs:
  audit:
    name: pip-audit + bandit + sbom
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"

      - name: regenerate lockfile
        run: |
          python scripts/lock_deps.py

      - name: pip-audit (OSV vulnerability scan)
        # Audit the freshly-resolved lockfile (so TRANSITIVE vulns are
        # caught too, not just declared deps). 2026-06-16: this is now a
        # HARD GATE — the external audit flagged the old report-only
        # `|| true` as "supply-chain not enforceable." First line writes
        # the JSON artifact (kept non-fatal so the artifact always
        # uploads). Second line FAILS the build on any known
        # vulnerability. The current resolved tree is clean (verified
        # locally: pip-audit exit 0). If a future transitive advisory
        # has no fix yet, add a documented `--ignore-vuln <ID>` here
        # rather than reinstating a blanket `|| true`.
        run: |
          python -m pip_audit --requirement requirements.lock --format json --output pip-audit.json || true
          python -m pip_audit --requirement requirements.lock

      - name: bandit (SAST)
        # Excludes + skip-list configured in pyproject.toml [tool.bandit].
        # First line archives the FULL findings (all severities) as the
        # bandit.json artifact for review. Second line is the GATE: it
        # fails CI only on MEDIUM+ severity findings, so the ~255
        # LOW-severity intentional patterns in this codebase (try/except/
        # pass best-effort cleanup, no-shell subprocess, non-crypto random,
        # partial exe paths) don't block every push while genuine
        # medium/high issues still hard-fail. 2026-06-04.
        run: |
          bandit -c pyproject.toml -r src/one_link -f json -o bandit.json || true
          bandit -c pyproject.toml -r src/one_link --severity-level medium

      - name: generate SBOM
        run: |
          python scripts/gen_sbom.py --from requirements --output dist/sbom.cdx.json

      - name: upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            requirements.lock
            pip-audit.json
            bandit.json
            dist/sbom.cdx.json
          if-no-files-found: warn

      # NOTE (2026-06-16): no committed-lockfile "drift" gate here on
      # purpose. pip-tools locks are PLATFORM-SPECIFIC, so a single
      # committed requirements.lock would spuriously "drift" between the
      # Win/Mac/Linux build legs. The enforceable guarantee is the HARD
      # pip-audit gate above, which re-resolves + audits the full
      # dependency tree on every run and fails on any known CVE. A
      # committed, reproducible, cross-platform lock is future work that
      # needs a universal resolver (e.g. uv) rather than pip-tools.
