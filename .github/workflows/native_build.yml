# File engine v2 — Rust workspace build + test gate.
#
# Per ADR-0008 (Python ↔ Rust FFI contract) verification gate #1:
# `maturin develop --release` succeeds on Linux + macOS + Windows in CI;
# all test crates import without error; pyo3 binding integration tests pass.
#
# This workflow runs on every PR that touches `native/`, `src/one_link/chunk_native.py`,
# or `tests/test_chunk_native_*.py`. Expand the path filter as new native
# crates ship (one_link.aead_native.py, etc.).

name: file-engine v2 native build

on:
  push:
    branches: [master]
    paths:
      - "native/**"
      - "src/one_link/chunk_native.py"
      - "src/one_link/aead_native.py"
      - "src/one_link/wal_native.py"
      - "src/one_link/chunk_store_native.py"
      - "src/one_link/quic_native.py"
      - "src/one_link/perf_lab_native.py"
      - "src/one_link/capability_native.py"
      - "src/one_link/crdt_native.py"
      - "src/one_link/hwkey_native.py"
      - "tests/test_chunk_native_*.py"
      - "tests/test_aead_native_*.py"
      - "tests/test_wal_native_*.py"
      - "tests/test_chunk_store_native_*.py"
      - "tests/test_quic_native_*.py"
      - "tests/unit/test_phase_c3_native_smoke.py"
      - ".github/workflows/native_build.yml"
  pull_request:
    paths:
      - "native/**"
      - "src/one_link/chunk_native.py"
      - "src/one_link/aead_native.py"
      - "src/one_link/wal_native.py"
      - "src/one_link/chunk_store_native.py"
      - "src/one_link/quic_native.py"
      - "src/one_link/perf_lab_native.py"
      - "src/one_link/capability_native.py"
      - "src/one_link/crdt_native.py"
      - "src/one_link/hwkey_native.py"
      - "tests/test_chunk_native_*.py"
      - "tests/test_aead_native_*.py"
      - "tests/test_wal_native_*.py"
      - "tests/test_chunk_store_native_*.py"
      - "tests/test_quic_native_*.py"
      - "tests/unit/test_phase_c3_native_smoke.py"
      - ".github/workflows/native_build.yml"

jobs:
  rust_workspace:
    name: cargo test (workspace)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Gate on the DEFAULT clippy group (correctness/style/complexity/
      # perf/suspicious). The workspace opts `clippy::pedantic` in as
      # *warnings* (200+ doc-backtick/cast nits) — those stay advisory,
      # not blocking, so `-D warnings` would wrongly fail the build.
      # `one_link_native` is the pyo3 cdylib; it needs maturin/Python to
      # build and is exercised by the `python_binding` job below, so the
      # pure-Rust lint job excludes it for determinism.
      - name: cargo clippy (deny clippy::all, allow opt-in pedantic)
        run: >-
          cargo clippy --workspace --all-targets --exclude one_link_native --
          -D clippy::all -A clippy::pedantic -A clippy::nursery -A clippy::cargo

      # Default test run. Wall-clock constant-time gates (timing_gate!)
      # run + measure + print here but only WARN if over threshold — they
      # are too noisy on shared CI runners to be a sound HARD gate (see
      # native/test_support/timing_gate.rs). The strict run is below.
      #
      # Generous timeout: a COLD rust-cache must compile ~40 crates
      # (ML-KEM / ML-DSA / curve25519 ...) in release from scratch, which
      # can exceed 30 min on shared runners. Warm-cache runs finish in a
      # few minutes — the high ceiling only bites on a cache miss, it is
      # not a hang. Build first with --no-run so a compile blow-up is
      # attributed to the build, not swallowed by the run timeout.
      - name: cargo test (build)
        timeout-minutes: 55
        run: cargo test --workspace --exclude one_link_native --release --no-run
      - name: cargo test (run)
        timeout-minutes: 20
        run: cargo test --workspace --exclude one_link_native --release

      # Non-blocking strict pass: enforce the wall-clock timing gates
      # (OL_TIMING_GATES=1) + the ignored property-test slow paths. Surfaces
      # a timing regression as a visible (continue-on-error) signal without
      # failing the build on runner jitter. Run them strictly + reliably on
      # a quiet/pinned machine, or promote to a dedicated nightly job later.
      - name: cargo test (strict timing gates + property slow paths)
        timeout-minutes: 20
        env:
          OL_TIMING_GATES: "1"
        run: cargo test --workspace --exclude one_link_native --release -- --include-ignored
        continue-on-error: true # timing gates are noisy on shared runners; property-tests still alpha

  python_binding:
    name: maturin build + python tests
    needs: rust_workspace
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install maturin + project deps
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.5,<2.0" pytest blake3
          pip install -e .

      - name: Build + install one_link_native (editable)
        working-directory: native
        run: maturin develop --release

      - name: Run native regression tests (chunk + aead + wal + chunk_store + quic)
        run: |
          pytest tests/test_chunk_native_v0210.py \
                 tests/test_aead_native_v0210.py \
                 tests/test_wal_native_v0210.py \
                 tests/test_chunk_store_native_v0210.py \
                 tests/test_quic_native_v0210.py \
                 -v --tb=short

      - name: Run Phase C-3 smoke tests (capability + crdt + hwkey)
        run: |
          pytest tests/unit/test_phase_c3_native_smoke.py -v --tb=short

      - name: Run perf_lab_native (smoke)
        run: |
          python -c "from one_link.perf_lab_native import run_full_suite, render_report; \
            print(render_report(run_full_suite(size_mib=8, include_legacy=False)))"
