name: tests

# ----------------------------------------------------------------------------
# macOS runners removed from this workflow on 2026-05-06.
#
# Why: macOS-latest is billed at ~$0.08/min vs $0.008/min for Linux (10x
# premium). Running it on every push to a pure-Python project with no
# Mac-specific code was burning ~$40/month in metered Actions usage with
# zero added coverage.
#
# What changed:
#   - Test matrix: was [windows-latest, macos-latest], now
#     [ubuntu-latest, windows-latest]. Linux is free under the included
#     Actions allowance and gives equivalent coverage for this codebase
#     (pure Python, X25519 / ChaCha20-Poly1305 / Ed25519 / mDNS — no
#     AppKit / CoreFoundation / Mac-only APIs).
#   - The `build_macos_binary` job below is commented out (see the block
#     near the bottom of this file). The README only ships a Windows
#     binary today, so the macOS artifact had no consumer.
#
# If you ever need macOS coverage back (e.g. shipping a signed Mac
# binary, debugging a Mac-only bug):
#   - For one-off checks: re-enable via the GitHub UI by adding a
#     `workflow_dispatch:` trigger and running the job manually.
#   - For release-time builds: gate macOS jobs behind
#     `if: startsWith(github.ref, 'refs/tags/')` so they only fire on
#     tag pushes, not every commit.
# ----------------------------------------------------------------------------

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: install
        run: uv sync --frozen --python python --extra dev

      - name: unit tests (no network)
        run: |
          uv run --frozen --extra dev python -m pytest tests/test_identity.py tests/test_wire.py tests/test_paths.py tests/test_channel.py tests/test_discovery.py tests/test_cli.py -v

      - name: integration tests (two-daemon, mDNS)
        run: |
          uv run --frozen --extra dev python -m pytest tests/test_integration.py tests/test_raw_protocol.py tests/test_resilience.py tests/test_tail.py -v
        env:
          ONE_LINK_RUN_LIVE_INTEGRATION: "1"
          PYTHONUNBUFFERED: "1"

      - name: call reliability soak gate
        env:
          REPORT_OS: ${{ matrix.os }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv run --frozen --extra dev python scripts/call_reliability_soak_gate.py --iterations 320 --out "benchmarks/results/call-reliability-soak-${REPORT_OS}-py${PYTHON_VERSION}.json"

      - name: upload call reliability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: call-reliability-soak-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            benchmarks/results/call-reliability-soak-${{ matrix.os }}-py${{ matrix.python }}.json
            benchmarks/results/call-reliability-soak-${{ matrix.os }}-py${{ matrix.python }}.jsonl
          if-no-files-found: warn

  build_windows_binary:
    name: build Windows binary
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: setup native CDC compiler
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: install
        run: uv sync --frozen --python python --extra dev --extra release

      - name: build
        # --allow-native-cdc-fallback: native CDC is an optional
        # accelerator; don't hard-fail the smoke build on a flaky gcc
        # compile (matches auto_build.yml + the maturin fallback).
        run: uv run --frozen --extra dev --extra release python scripts/build_binary.py --allow-native-cdc-fallback

      - name: upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-link-windows
          # onedir layout: the exe lives in dist/one-link/, not dist/.
          # The previous dist/one-link.exe path never matched, so this
          # smoke job's upload step always failed.
          path: dist/one-link/one-link.exe
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # build_macos_binary — DISABLED on 2026-05-06 (cost: macos-latest @ ~$0.08/min
  # billed every master push, no documented consumer for the artifact).
  #
  # To re-enable: uncomment the block below AND add a tag-only guard so it
  # doesn't fire on every push, e.g.:
  #     if: startsWith(github.ref, 'refs/tags/')
  # That way you only pay for a Mac runner when you actually cut a release.
  # --------------------------------------------------------------------------
