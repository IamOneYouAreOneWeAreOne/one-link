name: tests

# ----------------------------------------------------------------------------
# macOS runners removed from this workflow on 2026-05-06.
#
# Why: macOS-latest is billed at ~$0.08/min vs $0.008/min for Linux (10x
# premium). Running it on every push to a pure-Python project with no
# Mac-specific code was burning ~$40/month in metered Actions usage with
# zero added coverage.
#
# What changed:
#   - Test matrix: was [windows-latest, macos-latest], now
#     [ubuntu-latest, windows-latest]. Linux is free under the included
#     Actions allowance and gives equivalent coverage for this codebase
#     (pure Python, X25519 / ChaCha20-Poly1305 / Ed25519 / mDNS — no
#     AppKit / CoreFoundation / Mac-only APIs).
#   - The `build_macos_binary` job below is commented out (see the block
#     near the bottom of this file). The README only ships a Windows
#     binary today, so the macOS artifact had no consumer.
#
# If you ever need macOS coverage back (e.g. shipping a signed Mac
# binary, debugging a Mac-only bug):
#   - For one-off checks: re-enable via the GitHub UI by adding a
#     `workflow_dispatch:` trigger and running the job manually.
#   - For release-time builds: gate macOS jobs behind
#     `if: startsWith(github.ref, 'refs/tags/')` so they only fire on
#     tag pushes, not every commit.
# ----------------------------------------------------------------------------

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Without a cap a wedged hosted runner never concludes, and this gate is
    # load-bearing: publish_rolling.yml refuses to move the public download
    # unless `tests` reports SUCCESS for the exact commit. One stuck runner
    # therefore froze the download button indefinitely (observed: a run whose
    # jobs sat 3 hours with no step progress after 30 s). A timeout turns
    # "stuck forever" into a definite verdict CI can act on. 40 min is
    # generous for the longest real leg -- the 320-iteration call-reliability
    # soak -- and short enough that a wedge is caught within one cycle.
    # Mirrors the same guard auto_build.yml already carries.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      # THE reason this gate never concluded. tests/test_channel.py exercises
      # the live channel handshake, which fails closed without the verified
      # one_link_native pqkem ABI (no classical/NullKEM downgrade by design).
      # So test_handshake_succeeds failed, and the very next test --
      # test_initiator_rejects_bad_responder_signature -- then blocked forever
      # in selectors.select() waiting on a peer that could never complete a
      # handshake. The step burned the whole job budget and the gate reported
      # nothing, which also froze the download publisher that depends on it.
      # full_suite_and_e2e.yml already builds the engine for exactly this
      # reason; the fast gate needs it too, or it cannot honestly run the
      # channel suite at all.
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Cache cargo target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: native

      - name: install
        run: uv sync --frozen --python python --extra dev --extra release

      - name: Build native (release)
        working-directory: native
        run: uv run --project .. --frozen --extra release maturin develop --release --locked

      - name: unit tests (no network)
        # --timeout turns a hang into EVIDENCE. This step blocked for the full
        # job duration on every recent run -- 40 min after the job cap was
        # added, and hours before it -- while the same command finishes in ~18
        # seconds locally, so the culprit is environment-specific and cannot be
        # found by staring at the code. timeout-method=thread dumps every
        # thread's stack for the offending test, which names the blocking call
        # instead of leaving a silent 40-minute hole. pytest-timeout is already
        # a declared dev dependency; it simply was not being used.
        run: |
          uv run --frozen --extra dev --extra release python -m pytest tests/test_identity.py tests/test_wire.py tests/test_paths.py tests/test_channel.py tests/test_discovery.py tests/test_cli.py -v --timeout=120 --timeout-method=thread

      - name: integration tests (two-daemon, mDNS)
        # Live two-daemon + mDNS work is the likeliest place for a socket wait
        # to never return on a runner, so it gets a longer per-test budget than
        # the unit step but the same "name the hang" guarantee.
        run: |
          uv run --frozen --extra dev --extra release python -m pytest tests/test_integration.py tests/test_raw_protocol.py tests/test_resilience.py tests/test_tail.py -v --timeout=300 --timeout-method=thread
        env:
          ONE_LINK_RUN_LIVE_INTEGRATION: "1"
          PYTHONUNBUFFERED: "1"

      - name: call reliability soak gate
        env:
          REPORT_OS: ${{ matrix.os }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv run --frozen --extra dev --extra release python scripts/call_reliability_soak_gate.py --iterations 320 --out "benchmarks/results/call-reliability-soak-${REPORT_OS}-py${PYTHON_VERSION}.json"

      - name: upload call reliability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: call-reliability-soak-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            benchmarks/results/call-reliability-soak-${{ matrix.os }}-py${{ matrix.python }}.json
            benchmarks/results/call-reliability-soak-${{ matrix.os }}-py${{ matrix.python }}.jsonl
          if-no-files-found: warn

  build_windows_binary:
    name: build Windows binary
    runs-on: windows-latest
    needs: test
    # Same reason as `test` above: this job gates the run's overall
    # conclusion, so it must never be able to hang without a verdict.
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: setup native CDC compiler
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: install
        run: uv sync --frozen --python python --extra dev --extra release

      - name: build
        # NO --allow-native-cdc-fallback. build_binary.py now REFUSES that flag
        # for stable artifacts (exit 12, "non-releasable"), so this step could
        # only ever have failed -- invisibly, because `needs: test` meant the
        # job was skipped on every run while the tests gate never concluded.
        # The flakiness it was meant to absorb is handled properly now:
        # native_cdc tries every available compiler, and this job installs
        # MSYS2 gcc above, so the accelerator has a linkable toolchain.
        run: uv run --frozen --extra dev --extra release python scripts/build_binary.py

      - name: upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-link-windows
          # onedir layout: the exe lives in dist/one-link/, not dist/.
          # The previous dist/one-link.exe path never matched, so this
          # smoke job's upload step always failed.
          path: dist/one-link/one-link.exe
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # build_macos_binary — DISABLED on 2026-05-06 (cost: macos-latest @ ~$0.08/min
  # billed every master push, no documented consumer for the artifact).
  #
  # To re-enable: uncomment the block below AND add a tag-only guard so it
  # doesn't fire on every push, e.g.:
  #     if: startsWith(github.ref, 'refs/tags/')
  # That way you only pay for a Mac runner when you actually cut a release.
  # --------------------------------------------------------------------------
