name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: unit tests (no network)
        run: |
          python -m pytest tests/test_identity.py tests/test_wire.py tests/test_paths.py tests/test_channel.py tests/test_discovery.py tests/test_cli.py -v

      - name: integration tests (two-daemon, mDNS)
        run: |
          python -m pytest tests/test_integration.py tests/test_raw_protocol.py tests/test_resilience.py tests/test_tail.py -v
        env:
          PYTHONUNBUFFERED: "1"
        # mDNS reliability varies by runner. Don't fail the build on flakes,
        # but surface them in the log.
        continue-on-error: true

  build_windows_binary:
    name: build Windows binary
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: build
        run: python scripts/build_binary.py

      - name: upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-link-windows
          path: dist/one-link.exe
          if-no-files-found: error

  build_macos_binary:
    name: build macOS binary
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: build
        run: python scripts/build_binary.py

      - name: upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-link-macos
          path: dist/one-link
          if-no-files-found: error
