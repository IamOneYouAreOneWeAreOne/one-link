name: release

# Reproducible-build + signed-attestation pipeline for tagged releases.
# Goals:
#   1. Anyone can rebuild from source and get the same binary.
#   2. Each release artifact carries a Sigstore attestation in the
#      public Rekor transparency log so consumers can verify
#      "this artifact was built from this commit by GitHub Actions
#      on this date" without trusting a single private signing key.
#   3. SHA-256 manifest published alongside the artifacts so a
#      stripped-down verify path (curl + sha256sum) works for
#      users who can't or won't install sigstore.
#
# Sovereignty note: Sigstore's Fulcio + Rekor are operated by the
# Linux Foundation OpenSSF and ARE corporate-substrate dependencies.
# The trust model is "transparent append-only log," not "trust the
# operator," so a compromised Fulcio can't quietly forge a sig
# without the forgery showing up in Rekor (which we and our users
# audit). Once the project incorporates as a non-profit foundation
# and stands up its own HSM-backed multi-maintainer threshold key
# (see NOTICE), this workflow will switch to the in-house signing
# pipeline. Until then Sigstore is the pragmatic baseline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write    # create release + upload assets
  id-token: write    # OIDC token for Sigstore keyless signing
  attestations: write

jobs:
  call_reliability_gate:
    name: call reliability release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: deterministic call reliability soak
        run: |
          python scripts/call_reliability_soak_gate.py --iterations 640 --out benchmarks/results/release-call-reliability-soak.json

      - name: upload call reliability evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-call-reliability-soak
          path: |
            benchmarks/results/release-call-reliability-soak.json
            benchmarks/results/release-call-reliability-soak.jsonl
          if-no-files-found: warn

  build:
    name: build reproducible artifacts
    needs: call_reliability_gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SOURCE_DATE_EPOCH = commit date is
          # deterministic across re-runs.
          fetch-depth: 0

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: read version + source-date-epoch
        id: meta
        # Use the tag's commit timestamp as SOURCE_DATE_EPOCH so
        # rebuild-from-source by anyone on any machine produces
        # byte-identical sdist + wheel. The Python build backend
        # (setuptools) honors SOURCE_DATE_EPOCH when zipping.
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if [ "$version" = "$GITHUB_REF" ]; then
            version=$(grep -E '^version' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          source_date_epoch=$(git log -1 --format=%ct)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "Building One Link $version (SOURCE_DATE_EPOCH=$source_date_epoch)"

      - name: install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: build sdist + wheel reproducibly
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
          PYTHONHASHSEED: 0
        run: |
          # Clean any prior artifacts that would taint the hash
          rm -rf dist/ build/ *.egg-info
          python -m build --sdist --wheel --outdir dist/

      - name: compute SHA-256 manifest
        run: |
          cd dist
          # Generate a deterministic manifest of (hash, filename)
          # pairs sorted by filename so two builds produce
          # byte-identical SHA256SUMS files.
          sha256sum * | sort -k 2 > SHA256SUMS
          cat SHA256SUMS

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

  # Native wheels per OS — one_link_native (Rust hot-path: chunk store,
  # AEAD, WAL, QUIC, coherence-field). abi3 means one wheel per OS
  # covers Python 3.11+, so this is a 3-job matrix rather than 9.
  native_wheels:
    name: native wheel — ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 — historical baseline.
          - os: ubuntu-latest
            artifact: native-wheel-linux-x86_64
          # macos-13 (Intel Mac native wheel) dropped — see
          # auto_build.yml comment for the runner-pool starvation
          # rationale.
          - os: windows-latest
            artifact: native-wheel-windows-x86_64
          # arm64 — coverage parity.
          - os: macos-latest     # Apple Silicon (M-series)
            artifact: native-wheel-macos-arm64
          - os: ubuntu-24.04-arm # Raspberry Pi 4/5 64-bit, ARM Linux
            artifact: native-wheel-linux-arm64
          - os: windows-11-arm   # Snapdragon X / Surface Pro X
            artifact: native-wheel-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install maturin
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.5,<2.0"

      - name: cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: build native wheel (abi3, release)
        working-directory: native
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: python -m maturin build --release --strip

      - name: upload native wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native/target/wheels/*.whl

  # Standalone binaries per OS — what end users actually download
  # from the website. PyInstaller bundles Python + all deps + the
  # native wheels into a single executable. Users double-click and
  # the daemon starts; no pip, no Python install.
  binaries:
    name: standalone binary — ${{ matrix.os }}
    needs: [build, native_wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 — original lineup. ``asset_name`` stays as-is for
          # the macos / windows rows so existing bookmarks of
          # ``one-link-macos.zip`` and ``one-link-windows.exe.zip``
          # keep resolving; arch-suffixed names get added for the
          # new platforms below.
          - os: ubuntu-latest
            artifact: binary-linux-x86_64
            asset_name: one-link-linux-x86_64
            native_artifact: native-wheel-linux-x86_64
          - os: macos-latest
            artifact: binary-macos-arm64
            asset_name: one-link-macos
            native_artifact: native-wheel-macos-arm64
          - os: windows-latest
            artifact: binary-windows-x86_64
            asset_name: one-link-windows.exe
            native_artifact: native-wheel-windows-x86_64
          # ── new architecture coverage ────────────────────────
          # macos-13 (Intel Mac binary) dropped — see auto_build.yml
          # comment for the runner-pool starvation rationale.
          - os: ubuntu-24.04-arm
            artifact: binary-linux-arm64
            asset_name: one-link-linux-arm64
            native_artifact: native-wheel-linux-arm64
          - os: windows-11-arm
            artifact: binary-windows-arm64
            asset_name: one-link-windows-arm64.exe
            native_artifact: native-wheel-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Rust toolchain
        # Needed BEFORE ``pip install -e .`` on win_arm64 because
        # cryptography has no win_arm64 wheel and falls through to a
        # Rust source build. On every other leg this step costs ~3 s
        # and is otherwise unused at the binaries-job layer (native
        # code lands as a prebuilt wheel from ``native_wheels``).
        # Mirrors auto_build.yml exactly.
        uses: dtolnay/rust-toolchain@stable

      - name: install OpenSSL on Windows ARM64 (cryptography build dep)
        # See auto_build.yml for the full rationale — same setup, same
        # cache key, so the binaries job can reuse what auto_build
        # populated (when run on the same runner image).
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { throw "VCPKG_INSTALLATION_ROOT not set on this runner" }
          & "$vcpkg\vcpkg.exe" install openssl:arm64-windows --recurse
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install openssl failed (exit $LASTEXITCODE)" }
          $prefix = "$vcpkg\installed\arm64-windows"
          "OPENSSL_DIR=$prefix"                 | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_LIB_DIR=$prefix\lib"         | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_INCLUDE_DIR=$prefix\include" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "OPENSSL_NO_VENDOR=1"                 | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "$prefix\bin"                         | Out-File -Append $env:GITHUB_PATH -Encoding utf8

      - name: cache vcpkg ARM64 OpenSSL build
        if: matrix.os == 'windows-11-arm'
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed/arm64-windows
            C:/vcpkg/packages/openssl_arm64-windows
          key: vcpkg-openssl-arm64-windows-v1

      - name: install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          # ML stack: onnxruntime (~20 MB) + numpy + scipy for the
          # Tier ζ/η/θ semantic codecs. torch is INSTALLED here only
          # to export the .onnx weights from the .pt checkpoints
          # below; it is NOT bundled into the binary.
          pip install onnxruntime onnx onnxscript torch --index-url https://download.pytorch.org/whl/cpu

      # Pull the native wheel built earlier in the same workflow
      # and install it so PyInstaller's --collect-all picks up the
      # .pyd / .so / .dylib. This is the link between phases 1 + 4
      # in the production-install plan.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native_artifact }}
          path: native-wheel/
      - name: install native wheel into build env
        shell: bash
        run: |
          pip install --force-reinstall --no-deps native-wheel/*.whl

      # Export .pt → .onnx so PyInstaller bundles the small ONNX
      # checkpoints rather than the larger .pt ones. The bundled
      # binary loads via onnxruntime; torch never ships.
      - name: export models to ONNX
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/export_ml_to_onnx.py

      - name: build standalone binary
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.build.outputs.source_date_epoch }}
        run: python scripts/build_binary.py

      # Rename the produced binary to a per-OS asset name so users
      # downloading from the release page see `one-link-windows.exe`
      # / `one-link-macos` / `one-link-linux-x86_64`, not three
      # identically-named files.
      - name: stage binary for upload (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p staged
          cp dist/one-link.exe staged/${{ matrix.asset_name }}
      - name: stage binary for upload (posix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p staged
          cp dist/one-link staged/${{ matrix.asset_name }}
          chmod +x staged/${{ matrix.asset_name }}

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staged/${{ matrix.asset_name }}

  sign:
    name: sigstore-attest dist
    needs: [build, native_wheels, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Merge per-OS native wheels into dist/ so they get signed and
      # attached to the release alongside the pure-Python wheel.
      - uses: actions/download-artifact@v4
        with:
          name: native-wheel-linux
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: native-wheel-macos
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: native-wheel-windows
          path: dist/

      # Standalone binaries — what end users download from the
      # website. Sigstore signs these too so anyone can verify
      # the .exe / mac binary / linux binary was built from the
      # matching tag by GitHub Actions.
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: binary-macos
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: binary-windows
          path: dist/

      # Re-compute the SHA256SUMS manifest now that native wheels +
      # standalone binaries are included. The build job's manifest
      # only covered the pure-Python artifacts; downloads of the
      # native wheels or binaries would otherwise have no verifiable
      # hash in the release.
      - name: recompute SHA256SUMS to include native wheels + binaries
        run: |
          cd dist
          # Hash every distributable file. The binaries have no
          # extension on macOS/Linux, so we glob on `one-link*`
          # to catch them all, then dedupe with sort -u.
          {
            sha256sum *.whl 2>/dev/null
            sha256sum *.tar.gz 2>/dev/null
            sha256sum one-link* 2>/dev/null
          } | sort -k 2 -u > SHA256SUMS
          cat SHA256SUMS

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install sigstore
        run: |
          python -m pip install --upgrade pip
          pip install sigstore

      - name: sigstore-sign each artifact
        run: |
          cd dist
          # Sign every wheel, source tarball, the SHA manifest, AND
          # the standalone binaries. The binaries are what end users
          # actually download from the website, so they're the most
          # important to attest.
          for f in *.whl *.tar.gz one-link-* SHA256SUMS; do
            [ -f "$f" ] || continue
            python -m sigstore sign --bundle "$f.sigstore" "$f"
          done
          ls -la

      - name: attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/one-link-*
            dist/SHA256SUMS

      - name: create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/one-link-*
            dist/*.sigstore
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## One Link ${{ needs.build.outputs.version }}

            Reproducible-build artifacts published with Sigstore
            keyless attestations. Anyone can verify a download
            with:

            ```bash
            bash scripts/verify-release.sh dist/<artifact>
            ```

            Or with the sigstore tool directly:

            ```bash
            python -m sigstore verify identity \
              --bundle <artifact>.sigstore \
              --cert-identity 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v${{ needs.build.outputs.version }}' \
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
              <artifact>
            ```

            **SOURCE_DATE_EPOCH:** `${{ needs.build.outputs.source_date_epoch }}`
            (rebuild from source with that env var set to verify
            byte-equal artifacts).
