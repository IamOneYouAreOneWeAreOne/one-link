name: e2e browser call UI

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"

jobs:
  e2e-browser-call-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: list available Chromium browsers
        run: |
          python scripts/browser_call_media_soak_gate.py --list-browsers

      - name: real One Link UI call over two daemons
        run: |
          python scripts/e2e_call_ui_browser_gate.py --wait-media-s 40 --out benchmarks/results/e2e-call-ui-browser-gate.json

      - name: upload e2e call evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-call-ui-browser-gate
          path: benchmarks/results/e2e-call-ui-browser-gate.json
          if-no-files-found: warn
