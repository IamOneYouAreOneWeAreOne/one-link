# File engine v2 — per-PR benchmark gate.
#
# Per FILE_ENGINE_V2_PLAN.md "Verification (end-to-end)" #2:
# "PR rejected if cycles/byte regresses or throughput drops by >5% on any
# standardized corpus."
#
# This workflow:
#  1. Builds the native module (maturin develop --release).
#  2. Runs the perf_lab_native suite, emits JSON.
#  3. Compares against a baseline JSON committed at
#     `bench_baselines/native_chunk.json` (only the metrics tracked there;
#     extra metrics are ignored).
#  4. Fails if any tracked metric regresses by > 5 % vs. the baseline.
#
# The baseline is updated by the maintainer after a PR that intentionally
# changes the kernel; this is the single accepted way to relax a gate.

name: file-engine v2 bench gate

on:
  pull_request:
    paths:
      - "native/**"
      - "src/one_link/chunk_native.py"
      - "src/one_link/perf_lab_native.py"
      - "bench_baselines/**"
      - ".github/workflows/native_bench_gate.yml"

permissions:
  contents: read

concurrency:
  group: native-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench_gate:
    name: native file-engine benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Cache cargo target
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: native

      - name: Install deps
        run: uv sync --frozen --python python --extra release

      - name: Build native (release)
        working-directory: native
        run: uv run --project .. --frozen --extra release maturin develop --release --locked

      - name: Run perf_lab_native and emit JSON
        run: |
          uv run --frozen --extra release python -m one_link.perf_lab_native --json --no-legacy --size-mib 128 > bench_results.json
          cat bench_results.json

      - name: Gate against bench_baselines/native_chunk.json
        run: |
          uv run --frozen --extra release python scripts/bench_gate.py \
            --results bench_results.json \
            --baseline bench_baselines/native_chunk.json \
            --max-regression-percent 5
